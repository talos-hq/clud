schema = 3
profile = "library"
linter  = "zackees/ci.yml@839c8f6b03c08a94977d57eb339740407424a434"   # the exact ci-lint commit precheck runs

# ── Platforms ─────────────────────────────────────────────────────────────
# Derived from .github/workflows/ci.yml's own `runs-on:` labels and the
# targets its build/test jobs compile. Not a rewrite of ci.yml: this table
# exists so `ci-lint cache` can classify this repository's cache entries.
[platforms]
linux-x64   = { target = "x86_64-unknown-linux-gnu",  runs-on = "ubuntu-24.04",    group = "linux",   wheel = "manylinux_2_17" }
linux-arm   = { target = "aarch64-unknown-linux-gnu", runs-on = "ubuntu-24.04-arm", group = "linux",   wheel = "manylinux_2_17" }
windows-x64 = { target = "x86_64-pc-windows-msvc",    runs-on = "windows-2025",     group = "windows" }
windows-arm = { target = "aarch64-pc-windows-msvc",   runs-on = "windows-11-arm",   group = "windows" }
macos-arm   = { target = "aarch64-apple-darwin",      runs-on = "macos-15",         group = "macos" }
macos-x64   = { target = "x86_64-apple-darwin",       runs-on = "macos-15-intel",   group = "macos" }

[suites]
static      = { run = "python -m ci.lint",                    required = true }
dylint      = { run = "python -m ci.dylint_workspace",       required = true }
lint        = { run = "python -m ci.lint_rust",              required = true }
unit        = { run = "python -m ci.test_unit",              required = true }
integration = { run = "python -m ci.test_integration",       required = false }
harness     = { run = "python -m ci.test_harness",           required = false }

# `minimal` is what a main push runs: every Linux lane plus Static checks,
# Dylint, Lint and the Linux unit/integration/harness legs. The cross
# targets are added by label, exactly as ci.yml's `ci_matrix` resolves them.
# The default-branch cache writers wait for cache-maint's real pre-prune
# before saving. That ordered step backs flow.main's lockfile-peak waiver.
[flow.minimal]
platforms  = ["linux-x64"]
suites      = ["static", "dylint", "lint", "unit", "integration", "harness"]

[flow.windows]
platforms  = ["linux-x64", "windows-x64"]
suites      = ["static", "dylint", "lint", "unit", "integration", "harness"]

[flow.full]
platforms  = "all"
suites      = ["static", "dylint", "lint", "unit", "integration", "harness"]

[tags]
ci-windows = { flow = "windows" }
ci-full    = { flow = "full" }

# ── Cache sharing and management ───────────────────────────────────────────
# This repository sat at 10.56 GiB on 2026-10-04 -- OVER GitHub's 10 GB
# repository cap -- so new saves were being refused and pull requests were
# running on cold caches. Every family's key embeds a per-run hash, so each
# run appended an entry nothing retired; `max` sizes ONE entry and cannot
# bound the family, and `per` declares the writer shape rather than the
# entry count. `evict = "lru"` is what does (CACHE-029), and
# `ci-lint cache janitor` then keeps each family at `max x cardinality`.
[cache]
budget   = "9.5GB"
write-on = ["main"]
never    = []
retired  = []
pr       = { mode = "none", families = [], max-per-pr = "0MB", budget = "0MB", trim = "on-close" }

[cache.family]
# 1.17-1.38 GiB observed per entry; keyed per build target (build-<target>,
# dylint-zccache-<pass> x3 (#2061), static), so `per = "platform"` is the
# honest shape.
compile    = { via = "setup-soldr:build-cache",    max = "1400MB", lockfile = true, per = "platform", evict = "lru", promote = "ancestor" }
deps       = { via = "setup-soldr:cook",          max = "250MB",  lockfile = true, per = "none",     evict = "lru", promote = "ancestor" }
toolchain  = { via = "setup-soldr:solo-toolchain", max = "210MB",  per = "none",                evict = "lru" }
soldr-mini = { via = "setup-soldr:soldr-mini",    max = "15MB",   per = "none" }
uv         = { via = "setup-uv",                  max = "5MB",    per = "platform" }
# `cargoregistry` is a real `setup-soldr:*` shape (resolve-setup.ts:1055).
cargoregistry = { via = "setup-soldr:cargo-registry", max = "250MB", lockfile = true, per = "none", evict = "lru", promote = "ancestor" }

# This repository's own venv caches (.github/actions/setup-build and
# setup-exec), declared by literal prefix (zackees/ci.yml#347). Undeclared,
# the janitor would sweep them as CACHE-001 and every run would rebuild them.
# Only `main` pushes save them; every other run restores read-only.
venv-build = { prefix = "venv-build-", max = "80MB",  lockfile = true, per = "platform", evict = "lru" }
venv-exec  = { prefix = "venv-exec-",  max = "120MB", lockfile = true, per = "platform", evict = "lru" }
# Pass markers (#2078): empty entries keyed by a lane's input digest; the
# key is the only metadata. One per lane per passing tree, LRU-trimmed.
pass-v1    = { prefix = "pass-v1-",    max = "1MB",   min = "0B", per = "platform", evict = "lru" }
# setup-soldr's verdict ledger (zackees/soldr#3894, #2083): ~230 B pass
# records and per-job key manifests. setup-soldr's own janitor trims them
# (256 verdicts, 2 manifests per job scope); declared so CACHE-001 keeps them,
# and `min = "0B"` so CACHE-005 does not sweep them as poisoned (ci.yml#417).
soldr-verdict          = { prefix = "soldr-verdict-v1-",          max = "1MB", min = "0B", per = "none", evict = "lru" }
soldr-verdict-manifest = { prefix = "soldr-verdict-manifest-v1-", max = "1MB", min = "0B", per = "none", evict = "lru" }
# GUI runtime packages for the Linux unit shards (#2073), keyed per runner image.
gui-debs   = { prefix = "gui-debs-",   max = "200MB", per = "platform", evict = "lru" }

# Promotion (CACHE-024, #185, zackees/ci.yml#335). zackees/ci.yml standardizes
# promotion on setup-soldr's ancestor encoding -- shortest parent-edge distance
# from a live git DAG walk -- rather than this repository's `m<n>` first-parent
# ordinal, which inverts on wide merges (a 50-commit branch tip reports ordinal
# 53 while the merge commit containing it reports 4, so a cache saved at the
# merge looks older than one saved 50 commits before it). #335 keeps the
# `m<n>` label for offline audit only.
#
# Declaring `mode = "ancestor"` opts each family below into the LINEAGE LABEL
# that makes a nearest-ancestor search decidable -- a key ending in a bare
# content hash destroys the ancestry at save time (CACHE-031). This is still a
# declaration only: the setup-soldr pilot (#566) is merged but unreleased, so
# CACHE-030/032 report `needs_review` and the opt-in is silently inert until a
# release carries it. Recording it now is deliberate -- it is the policy this
# repository intends to adopt, and it is provably ready the day the tag lands.
[cache.promote]
mode          = "ancestor"
max-age-hours = 168

[local]
runner = "bosn-act"
lanes  = ["precheck", "fast"]
cache  = "machine"

[allow]
workflows         = { "ci.yml" = ["pull_request", "push:main", "merge_group", "schedule", "workflow_dispatch"], "_dylint.yml" = ["pull_request", "push:main", "schedule", "workflow_dispatch"], "_run-tests.yml" = ["pull_request", "push:main"], "auto-release.yml" = ["push:tag", "workflow_dispatch"] }
# The cache-pre-prune job is the one job that deletes live cache entries, and
# only ever on a default-branch push (`if: github.event_name == 'push' && ref ==
# main`, in ci.yml). It is granted here per job rather than relying on ci.yml's
# top-level `actions: write`, so the grant does not reach the `static` job,
# which checks out untrusted pull-request heads.
permissions        = { "actions: write" = ["cache-maint", "cancel-superseded", "queue-cache-janitor"] }
actions           = ["actions/checkout", "actions/upload-artifact", "actions/download-artifact", "forge-ci/setup-soldr", "astral-sh/setup-uv"]
# The unversioned interpreter only: ci/banned_python3.py bans the
# version-suffixed spelling in every tracked file (including this one), and
# clud's workflows invoke the unversioned form throughout.
tools             = ["soldr", "uv", "git", "jq", "python"]
setup-soldr       = { only-in = ".github/actions/setup-build", require = { save-cache-remote = "plan" } }
setup-uv          = { require = { save-cache = "plan" } }
platform-selector = "ci/ci_matrix.py"
platform-code     = ["ci/platform/**"]

[publish]
pypi = { auth = "oidc", environment = "pypi", mode = "mock" }
# The default-branch writer flow: `cache = "write"` marks it as a writer, and
# `pre-prune = true` is what waives the lockfile-change peak in CACHE-004.
# Without it the peak doubles a 9.3 GiB steady state and the declared shape
# cannot fit GitHub's 10 GB cap at all.
#
# The waiver is only honoured if something actually pre-prunes, so ci.yml's
# `cache-maint` job runs `ci-lint cache preprune --lockfile-changed` before the
# two default-branch cache writers (`dylint`, `build-linux-x64`). It is gated on
# a default-branch push, so a PR or tag run never deletes anything.
[flow.main]
extends   = "minimal"
cache     = "write"
pre-prune = true
