name: Setup exec runtime
description: >
  Python + uv only. Deliberately installs NO Rust toolchain: an exec job that
  cannot find `cargo` cannot silently fall back to compiling, which is the
  structural guarantee that mac/Windows runners stay cheap. If a test ever
  regresses into shelling out to cargo, it fails loudly here instead of
  quietly costing ten minutes of scarce runner time.

inputs:
  bundle-name:
    description: >-
      Artifact name of the build bundle to download. Empty for the release
      wheel smoke (#1545), which needs no bundle.
    required: false
    default: ""
  native-window-runtime:
    description: >-
      Install the Linux graphics packages the native-window tests need.
      Maintenance jobs pass false: they run no tests, and `apt-get update`
      alone has hung cache-maint past its timeout, skipping the build (#2038).
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # Native credential windows need a real graphics stack even when their
    # test display is Xvfb. In particular, winit panics without the X11 XKB
    # runtime instead of returning a graphics-initialization error (#1708).
    # The packages themselves come from an Actions cache (#2073): a mirror
    # outage failed a unit shard even with the bounded install below. Only a
    # cache miss touches the mirror; only `main` pushes save (CACHE-003).
    # ImageOS/ImageVersion are runner process env, not workflow `env`, so
    # `${{ env.ImageVersion }}` is empty in a key; read them from the shell.
    - name: Resolve runner image
      id: runner-image
      if: runner.os == 'Linux' && inputs.native-window-runtime == 'true'
      shell: bash
      run: echo "id=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

    - name: Restore Linux native window runtime packages
      id: gui-debs
      if: runner.os == 'Linux' && inputs.native-window-runtime == 'true'
      uses: actions/cache/restore@v4
      with:
        path: ~/gui-runtime-debs
        key: gui-debs-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-image.outputs.id }}-v1
        restore-keys: |
          gui-debs-${{ runner.os }}-${{ runner.arch }}-

    - name: Install Linux native window runtime
      id: gui-install
      if: runner.os == 'Linux' && inputs.native-window-runtime == 'true'
      shell: bash
      # Install from the image's own package lists first: an unbounded
      # `apt-get update` against a slow mirror held a unit shard for 11+
      # minutes (#2063). Only a stale or missing list falls back to an update.
      # dpkg fsyncs every file it unpacks; on a container's overlay disk
      # shared by several local gate runs that crawled at ~5 s per package
      # (26 of ~165 unpacked in 2 min) and the time cap killed it (exit 124,
      # #2162). The download itself takes ~20 s. `--force-unsafe-io` drops the
      # per-file fsync, which is safe on a throwaway runner. The fetch and the
      # local install are bounded separately; worst case 240 + 300 + 300 s stays
      # under the job's timeout-minutes.
      run: |
        set -euo pipefail
        apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
                  -o APT::Keep-Downloaded-Packages=true -o Dpkg::Options::=--force-unsafe-io)
        pkgs=(xvfb xauth xfonts-base xdotool weston libgl1-mesa-dri libegl1 libgles2
              libxkbcommon-x11-0 libxi6 libxcursor1 libxinerama1)
        debs="$HOME/gui-runtime-debs"
        mkdir -p "$debs"
        install_local() {
          sudo timeout 300 apt-get "${apt_opts[@]}" install -y --no-install-recommends --no-download "${pkgs[@]}"
        }
        if compgen -G "$debs/*.deb" >/dev/null; then
          sudo cp "$debs"/*.deb /var/cache/apt/archives/
          if install_local; then
            exit 0
          fi
          echo "::warning::cached GUI runtime packages were incomplete; using the mirror"
        fi
        fetch() {
          sudo timeout 300 apt-get "${apt_opts[@]}" install -y --no-install-recommends --download-only "${pkgs[@]}"
        }
        # An image shipped without package lists cannot satisfy the fast path.
        if ! compgen -G "/var/lib/apt/lists/*_Packages*" >/dev/null || ! fetch; then
          echo "::warning::package lists missing or stale; refreshing them"
          sudo timeout 240 apt-get "${apt_opts[@]}" update -qq
          fetch
        fi
        install_local
        cp /var/cache/apt/archives/*.deb "$debs"/ 2>/dev/null || true
        if compgen -G "$debs/*.deb" >/dev/null; then
          echo "debs=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Save Linux native window runtime packages
      if: >-
        runner.os == 'Linux' && inputs.native-window-runtime == 'true'
        && steps.gui-debs.outputs.cache-hit != 'true'
        && github.event_name == 'push' && github.ref == 'refs/heads/main'
        && steps.gui-install.outputs.debs == 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/gui-runtime-debs
        key: ${{ steps.gui-debs.outputs.cache-primary-key }}

    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - uses: astral-sh/setup-uv@v5
      with:
        version: "0.12.19"
        # Keep uv's wheel cache on Linux/macOS when the .venv cache misses.
        # Windows already restores .venv below; setup-uv's post-job cache
        # prune intermittently exits 2 after passing tests (#1475), turning
        # otherwise-green Windows jobs red. Disable only that cache path.
        enable-cache: ${{ runner.os != 'Windows' }}

    # Read-only everywhere but `main` pushes (CACHE-003): a PR or branch save
    # is scoped to that ref, so nothing else can restore it, yet it still
    # counts against the 10 GB budget and pushes live entries into LRU.
    - name: Restore venv
      id: venv-cache
      uses: actions/cache/restore@v4
      with:
        path: .venv
        key: venv-exec-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ hashFiles('uv.lock') }}
        restore-keys: |
          venv-exec-${{ runner.os }}-${{ runner.arch }}-py3.11-

    # `--no-default-groups --group test`, not `--group dev`: exec jobs cannot
    # compile, so cmake/maturin/ruff are pure download cost on the scarcest
    # runners in the pool. `--no-default-groups` is load-bearing -- uv includes
    # the `dev` group by default, so a bare `--group test` would install both.
    # `--no-install-project` keeps PEP 517 out of the picture entirely, so no
    # wheel build is triggered here.
    - name: Sync
      shell: bash
      run: uv sync --frozen --no-default-groups --group test --no-install-project --python 3.11

    - name: Save venv
      if: steps.venv-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v4
      with:
        path: .venv
        key: ${{ steps.venv-cache.outputs.cache-primary-key }}

    # See the identical step in ../setup-build: `uv run` would sync the project
    # and trigger a PEP 517 maturin build -- which on an exec runner hits the
    # poisoned soldr shim below and fails every job.
    - name: Export venv interpreter
      shell: bash
      run: |
        set -euo pipefail
        echo 'CLUD_TEST_NO_SECRET_UI=1' >> "$GITHUB_ENV"
        echo 'CLUD_TEST_REQUIRE_SECRET_CONSUMER=1' >> "$GITHUB_ENV"
        if [ -x .venv/Scripts/python.exe ]; then
          echo "VENV_PY=$(pwd)/.venv/Scripts/python.exe" >> "$GITHUB_ENV"
        elif [ -x .venv/bin/python ]; then
          echo "VENV_PY=$(pwd)/.venv/bin/python" >> "$GITHUB_ENV"
        else
          echo "::error::no .venv/{Scripts,bin}/python after uv sync"
          exit 1
        fi

    - name: Download bundle
      if: inputs.bundle-name != ''
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.bundle-name }}
        path: bundle-archive

    - name: Unpack bundle
      if: inputs.bundle-name != ''
      shell: bash
      run: '"$VENV_PY" -m ci.bundle unpack --archive-dir bundle-archive --dest bundle'

    # The hosted images ship Rust preinstalled, so we cannot assert `cargo` is
    # absent -- we have to actively poison it. Every cargo fallback in the test
    # suite (tests/test_hello.py:62-91, tests/integration/conftest.py:158-176,
    # crates/clud-bin/tests/integration/common/mod.rs:78-116) is a silent 10-minute cold
    # rebuild on the scarcest runners in the pool. Turning that into an
    # immediate, named failure is the whole point of the exec/build split.
    # Remove the toolchain rather than shadow it. A shim earlier on PATH is not
    # enough: Rust's own `Command::new("cargo")` resolves through Windows
    # `CreateProcess`, which only ever appends `.exe` -- a `cargo.cmd` shim would
    # be skipped and the real `cargo.exe` found. The test suite spawns cargo
    # from Rust (crates/clud-bin/tests/integration/common/mod.rs:78-116), so deletion is the
    # only reliable answer. Runner VMs are ephemeral.
    #
    # Why bother: every cargo fallback in the suite (tests/test_hello.py:62-91,
    # tests/integration/conftest.py:158-176, common/mod.rs:78-116) is a silent
    # 10-minute cold rebuild on the scarcest runners in the pool. Turning that
    # into an immediate, named failure is the point of the exec/build split.
    - name: Remove the Rust toolchain
      shell: bash
      run: |
        set -euo pipefail
        cargo_bin="${CARGO_HOME:-$HOME/.cargo}/bin"
        for tool in cargo rustc rustup soldr; do
          rm -f "$cargo_bin/$tool" "$cargo_bin/$tool.exe"
        done
        # Runner images also ship toolchains outside CARGO_HOME (macOS arm:
        # Homebrew rustup at /opt/homebrew/opt/rustup/bin). Delete every
        # real copy still on PATH.
        for tool in cargo rustc rustup; do
          for found in $(type -ap "$tool" || true); do
            rm -f "$found"
          done
        done
        shim_dir="${RUNNER_TEMP}/no-cargo"
        mkdir -p "$shim_dir"
        for tool in cargo rustc soldr; do
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'echo "::error::$(basename "$0") was invoked in an exec job. Exec jobs run prebuilt' \
            'bundle binaries and must never compile. A test fell back to building from source --' \
            'give it its binary via CLUD_TEST_*_BINARY or CARGO_TARGET_DIR instead." >&2' \
            'exit 127' > "$shim_dir/$tool"
          chmod +x "$shim_dir/$tool"
        done
        echo "$shim_dir" >> "$GITHUB_PATH"
        if command -v cargo >/dev/null 2>&1 && [ "$(command -v cargo)" != "$shim_dir/cargo" ]; then
          echo "::error::a real cargo survived at $(command -v cargo)"
          exit 1
        fi
