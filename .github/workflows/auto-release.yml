name: Auto Release

on:
  push:
    tags:
      - "[0-9]*"
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. 2.0.10 or v2.0.10). Leave empty to use the current workspace version."
        required: false
        type: string

# Serialize release publication with both Pages publishers.
concurrency:
  group: clud-pages-publication
  queue: max
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    outputs:
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
      candidate_sha: ${{ steps.meta.outputs.candidate_sha }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Resolve and validate release tag
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          RAW_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          cargo = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))
          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          workspace_version = cargo["workspace"]["package"]["version"]
          project_version = pyproject["project"]["version"]

          if workspace_version != project_version:
              sys.exit(
                  f"Version mismatch: Cargo.toml workspace={workspace_version}, "
                  f"pyproject.toml project={project_version}"
              )
          version = workspace_version

          event_name = os.environ["GITHUB_EVENT_NAME"]
          ref_type = os.environ.get("GITHUB_REF_TYPE", "")
          if event_name == "push" and ref_type == "tag":
              raw_tag = os.environ["GITHUB_REF_NAME"]
              checkout_ref = raw_tag
          else:
              raw_tag = os.environ.get("RAW_TAG", "").strip() or version
              checkout_ref = os.environ.get("GITHUB_SHA", "")

          candidate_sha = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          existing_tag = subprocess.run(
              ["git", "rev-parse", "--verify", f"refs/tags/{raw_tag}^{{commit}}"],
              capture_output=True,
              text=True,
          )
          if existing_tag.returncode == 0 and existing_tag.stdout.strip() != candidate_sha:
              sys.exit(f"Tag {raw_tag!r} points to a different candidate SHA")

          normalized = raw_tag[1:] if raw_tag.startswith("v") else raw_tag
          if normalized != version:
              sys.exit(
                  f"Tag {raw_tag!r} does not match workspace version {version!r}. "
                  "Bump Cargo.toml [workspace.package].version and pyproject.toml "
                  "[project].version, commit, and re-tag."
              )

          repo = os.environ["GITHUB_REPOSITORY"]
          seen = set()
          for candidate in (raw_tag, normalized, f"v{normalized}"):
              if not candidate or candidate in seen:
                  continue
              seen.add(candidate)
              result = subprocess.run(
                  ["gh", "api", f"repos/{repo}/releases/tags/{candidate}"],
                  capture_output=True,
                  text=True,
              )
              if result.returncode == 0 and result.stdout.strip():
                  data = json.loads(result.stdout)
                  if data.get("published_at"):
                      sys.exit(
                          f"Release {candidate} is already published at "
                          f"{data['published_at']} -- refusing to re-publish."
                      )

          out_path = os.environ["GITHUB_OUTPUT"]
          with open(out_path, "a", encoding="utf-8") as fh:
              fh.write(f"checkout_ref={checkout_ref}\n")
              fh.write(f"candidate_sha={candidate_sha}\n")
              fh.write(f"release_tag={raw_tag}\n")
              fh.write(f"version={version}\n")

          print(
              f"Resolved release tag={raw_tag} version={version} "
              f"ref={checkout_ref}"
          )
          PY

  # A release recomputes its own proof (#2202): the complete full-tier CI
  # workflow runs on the exact tagged SHA inside this run. No attestation,
  # reuse decision or earlier run is consulted, so a tag never waits on a
  # manual pre-dispatch. ci.yml's `CI OK` fails unless every selected job
  # passed, which fails this job and blocks every builder and publisher.
  full-ci-gate:
    name: Exact SHA full CI
    needs: preflight
    uses: ./.github/workflows/ci.yml
    # Reusable workflows get no secrets by default; setup-soldr's remote S3
    # build cache needs SOLDR_S3_CACHE_ACCESS_KEY / _SECRET_KEY.
    secrets: inherit
    with:
      candidate_sha: ${{ needs.preflight.outputs.candidate_sha }}
    # The union ci.yml's jobs request; a called workflow cannot exceed it.
    permissions:
      contents: read
      actions: write
      pull-requests: read
      issues: write

  snapshot-public:
    name: Snapshot prior public stable release and Pages pointer
    needs: [preflight, full-ci-gate]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      prior_tag: ${{ steps.snapshot.outputs.prior_tag }}
      prior_id: ${{ steps.snapshot.outputs.prior_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.candidate_sha }}
      - name: Refuse an existing tag and record previous public stable state
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        run: python -m ci.public_release snapshot "$RELEASE_TAG" prior-public-state.json
      - uses: actions/upload-artifact@v4
        with:
          name: prior-public-state
          path: prior-public-state.json
          if-no-files-found: error

  # The release matrix comes from ci/ci_matrix.py, the same table CI uses, so
  # release wheels are produced by the same cross-compile strategy CI exercised.
  # Shipping natively-built wheels while CI only ever tested cross-built
  # binaries would mean CI never validated the artifact that ships.
  release-matrix:
    name: Resolve release matrix
    needs: [preflight, full-ci-gate]
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.matrix.outputs.build }}
      static_musl: ${{ steps.matrix.outputs.static_musl }}
      smoke: ${{ steps.matrix.outputs.smoke }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.candidate_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: matrix
        run: python -m ci.ci_matrix --release

  build:
    name: Build wheels
    needs: [preflight, full-ci-gate, release-matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-matrix.outputs.build) }}
    # This is the ONLY caller in the repo permitted to pass profile: release.
    # _build-target.yml enforces that with a guard on github.workflow.
    uses: ./.github/workflows/_build-target.yml
    secrets: inherit
    with:
      source_ref: ${{ needs.preflight.outputs.candidate_sha }}
      target: ${{ matrix.target }}
      runs-on: ${{ matrix.runs-on }}
      strategy: ${{ matrix.strategy }}
      profile: release
      # Release builds ship artifacts; they do not need a test bundle, and
      # clippy already ran on this commit in CI.
      bundle: false
      clippy: false
      wheel-artifact: ${{ matrix.artifact }}
      include-sdist: ${{ matrix['include-sdist'] }}

  # #1545: pip-install the exact release wheel into a fresh venv on each native
  # Linux/macOS exec runner and run it before anything publishes. 2.8.14 and
  # 2.8.20 shipped a non-executable `clud` because nothing ever installed the
  # release-profile wheel (only the PR lane's dev wheel).
  wheel-smoke:
    name: Install-smoke release wheels
    needs: [preflight, release-matrix, build]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-matrix.outputs.smoke) }}
    uses: ./.github/workflows/_run-tests.yml
    with:
      source_ref: ${{ needs.preflight.outputs.candidate_sha }}
      target: ${{ matrix.target }}
      runs-on: ${{ matrix.runs-on }}
      suite: wheel-smoke
      wheel-artifact: ${{ matrix.artifact }}

  build-static-musl:
    name: Build static musl clud
    needs: [preflight, full-ci-gate, release-matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-matrix.outputs.static_musl) }}
    uses: ./.github/workflows/_build-target.yml
    secrets: inherit
    with:
      source_ref: ${{ needs.preflight.outputs.candidate_sha }}
      target: ${{ matrix.target }}
      runs-on: ${{ matrix.runs-on }}
      strategy: ${{ matrix.strategy }}
      profile: release
      bundle: false
      clippy: false
      standalone-artifact: ${{ matrix.artifact }}

  verify-static-musl-arm64:
    name: Execute release static musl ARM64
    needs: [preflight, build-static-musl]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.candidate_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: standalone-musl-aarch64
          path: standalone
      - name: Verify and execute uploaded ARM64 bytes
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          python -m installer.verify_native_assets "$RELEASE_VERSION" standalone aarch64-unknown-linux-musl
          binary="standalone/clud-$RELEASE_VERSION-aarch64-unknown-linux-musl"
          chmod +x "$binary"
          test "$("$binary" --version)" = "clud $RELEASE_VERSION"

  publish-pypi:
    name: Publish to PyPI
    needs: [preflight, full-ci-gate, build, wheel-smoke, candidate-acceptance-gate, verify-prior-public]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: List artifacts
        shell: bash
        run: ls -la dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true
          skip-existing: true

  publish-release:
    name: Publish final bytes as public prerelease
    needs: [preflight, full-ci-gate, snapshot-public, build, wheel-smoke, build-static-musl, verify-static-musl-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.candidate_sha }}

      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: standalone-musl-*
          path: standalone
          merge-multiple: true

      # Sidecar debug info for the released binaries (Linux `.dwp`; see
      # Cargo.toml [profile.release]). Downloaded into its own directory --
      # never dist/ -- and only here, so it can never reach publish-pypi's
      # packages-dir. Non-fatal: symbols are a nice-to-have, the release is not
      # allowed to fail because a target produced none.
      - name: Download debug info
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: debuginfo-*
          path: debuginfo
          merge-multiple: true

      - name: Extract Windows and macOS clud executables from release wheels
        run: python -m installer.release_assets '${{ needs.preflight.outputs.version }}' dist standalone

      - name: Verify six native download assets
        run: python -m installer.verify_native_assets '${{ needs.preflight.outputs.version }}' standalone

      # #1016: each Linux build job staged a one-line `clud-<triple>.build-id`
      # fragment beside its `.dwp`, read from the shipped binary. This is the
      # only job where every triple's fragments meet, so fold them into one
      # BUILD-IDS.txt asset here -- before the checksum step, so SHA256SUMS
      # covers it. `clud symbols install` fetches a `.dwp` only when the crash
      # report's build-id matches this file's entry for its triple.
      - name: Combine build-ids
        shell: bash
        run: |
          set -euo pipefail
          if [ -d debuginfo ]; then
            python -m ci.build_ids combine debuginfo
          fi

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          # `fail_on_unmatched_files` below had to relax to tolerate a missing
          # .dwp, so assert the load-bearing half of it here instead: a release
          # with no wheels is always a bug.
          ls dist/*.whl > /dev/null
          # Spans `debuginfo/` as well as `dist/`: a `.dwp` is fetched over the
          # network and fed to a symbolizer, which is exactly the asset that
          # wants a checksum, and #1016 builds on SHA256SUMS covering every
          # attached file. Hashing happens inside each directory so the entries
          # stay bare `./<name>` -- assets attach flat to the release, so a
          # `dist/` or `debuginfo/` prefix would break `sha256sum -c` for
          # anyone who downloads them into one directory. Exclude any
          # pre-existing SHA256SUMS sidecars from the uploaded input dirs.
          checksum_file="$RUNNER_TEMP/clud-release-SHA256SUMS"
          for dir in dist debuginfo standalone; do
            [ -d "$dir" ] || continue
            ( cd "$dir" && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 |
                sort -z | xargs -0 -r sha256sum )
          done > "$checksum_file"
          mv "$checksum_file" dist/SHA256SUMS
          cat dist/SHA256SUMS

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.preflight.outputs.release_tag }}
          name: clud ${{ needs.preflight.outputs.version }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          body: |
            ## Install

            **macOS / Linux:**

            ```bash
            curl -fsSL https://raw.githubusercontent.com/talos-hq/clud/main/install.sh | sh
            ```

            **Windows (PowerShell):**

            ```powershell
            irm https://raw.githubusercontent.com/talos-hq/clud/main/install.ps1 | iex
            ```

            Pin this exact version with `CLUD_VERSION=${{ needs.preflight.outputs.version }}` (POSIX) or `$env:CLUD_VERSION = '${{ needs.preflight.outputs.version }}'` (PowerShell) before piping into `sh` / `iex`.

            Already managing Python tools? Equivalent:

            ```bash
            uv tool install clud==${{ needs.preflight.outputs.version }}
            pipx install clud==${{ needs.preflight.outputs.version }}
            pip install clud==${{ needs.preflight.outputs.version }}
            ```

            Pre-built wheels for Linux (x86/ARM), Windows (x86/ARM), and macOS (x86/ARM) are attached below and available on PyPI.
          files: |
            dist/*
            debuginfo/*
            standalone/*
          # False only because `debuginfo/*` is legitimately allowed to be
          # empty. The "dist must not be empty" guard it used to provide is
          # asserted explicitly by the checksums step above.
          fail_on_unmatched_files: false

  publish-candidate-catalog:
    name: Attach versioned public candidate catalog
    needs: [preflight, publish-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.candidate_sha }}
      - name: Generate from anonymous published bytes while keeping prior stable
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        run: |
          python -m installer.candidate_catalog "$RELEASE_TAG" installer-candidate-manifest.json
          python -m pip install 'git+https://github.com/zackees/manifest.json@main'
          manifest-validate installer-candidate-manifest.json
      - name: Attach immutable candidate catalog to the same release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" installer-candidate-manifest.json

  verify-candidate-public:
    name: Verify anonymous final bytes and prerelease asset identity
    needs: [preflight, snapshot-public, publish-candidate-catalog]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.candidate_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: prior-public-state
          path: release-state
      - uses: actions/download-artifact@v4
        with:
          pattern: standalone-musl-*
          path: standalone
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Reconstruct exact six final native files
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: python -m installer.release_assets "$RELEASE_VERSION" dist standalone
      - name: Compare anonymous HTTPS assets to final build bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        run: |
          python -m ci.public_release verify-prerelease \
            "$RELEASE_TAG" standalone release-state/prior-public-state.json \
            release-state/candidate-public-state.json
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-public-state
          path: release-state/candidate-public-state.json
          if-no-files-found: error

  verify-candidate-installer:
    name: Verify public prerelease on every native host and guest
    needs: [preflight, verify-candidate-public]
    permissions:
      contents: read
    uses: ./.github/workflows/installer-check.yml
    secrets: inherit
    with:
      release_tag: ${{ needs.preflight.outputs.release_tag }}
      mode: candidate

  candidate-acceptance-gate:
    name: Require executed public candidate acceptance
    if: always()
    needs: verify-candidate-installer
    runs-on: ubuntu-24.04
    steps:
      - name: Reject a failed or skipped reusable matrix
        env:
          RESULT: ${{ needs.verify-candidate-installer.result }}
        run: test "$RESULT" = success

  verify-prior-public:
    name: Prove failed candidate cannot move previous stable
    needs: [preflight, candidate-acceptance-gate]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.candidate_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: candidate-public-state
          path: release-state
      - name: Recheck prior public release and Pages digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m ci.public_release verify-prior release-state/candidate-public-state.json

  promote-release:
    name: Promote the same public asset IDs to stable
    needs: [preflight, publish-pypi, verify-prior-public]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.candidate_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: candidate-public-state
          path: release-state
      - name: Compare and swap prerelease to latest stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m ci.public_release promote release-state/candidate-public-state.json

  build-install-site:
    name: Build and validate installer Pages
    needs: [preflight, promote-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      public_digest: ${{ steps.digest.outputs.value }}
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.candidate_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate catalog and site from published release assets
        run: python -m installer.site site
      - name: Preserve published model document
        run: python -m models.preserve site
      - name: Validate v1 catalog and public site paths
        run: |
          python -m pip install 'git+https://github.com/zackees/manifest.json@main'
          manifest-validate site/install/manifest.json
          python -m installer.verify_site site
      - name: Record staged installer Pages digest
        id: digest
        run: echo "value=$(sha256sum site/index.html site/install/index.html site/install/manifest.json | cut -d ' ' -f 1 | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-install-site:
    name: Deploy installer Pages
    needs: build-install-site
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Confirm public Pages are visible
        run: |
          mkdir -p public-site/install
          expected='${{ needs.build-install-site.outputs.public_digest }}'
          for attempt in $(seq 1 12); do
            actual=fetch-failed
            if curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 https://talosbot.ai/clud/index.html -o public-site/index.html &&
               curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 https://talosbot.ai/clud/install/index.html -o public-site/install/index.html &&
               curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 https://talosbot.ai/clud/install/manifest.json -o public-site/install/manifest.json; then
              actual=$(sha256sum public-site/index.html public-site/install/index.html public-site/install/manifest.json | cut -d ' ' -f 1 | sha256sum | cut -d ' ' -f 1)
              if [ "$actual" = "$expected" ]; then
                python -m installer.verify_site public-site
                exit 0
              fi
            fi
            echo "Waiting for Pages propagation ($attempt/12): $actual"
            sleep 5
          done
          echo '::error::Public installer Pages never matched the staged artifact' >&2
          exit 1

  verify-promoted-public:
    name: Prove promoted release is canonical latest stable
    needs: [preflight, deploy-install-site]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.candidate_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: candidate-public-state
          path: release-state
      - name: Verify public release asset IDs and Pages pointer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m ci.public_release verify-promoted release-state/candidate-public-state.json

  verify-published-installer:
    name: Verify promoted public bytes on all host platforms and guests
    needs: [preflight, verify-promoted-public]
    permissions:
      contents: read
    uses: ./.github/workflows/installer-check.yml
    secrets: inherit
    with:
      release_tag: ${{ needs.preflight.outputs.release_tag }}
      mode: released

  released-acceptance-gate:
    name: Require executed public released acceptance
    if: always()
    needs: verify-published-installer
    runs-on: ubuntu-24.04
    steps:
      - name: Reject a failed or skipped reusable matrix
        env:
          RESULT: ${{ needs.verify-published-installer.result }}
        run: test "$RESULT" = success

  rollback-public:
    name: Restore previous public stable after post-promotion failure
    if: always() && needs.publish-pypi.result == 'success' && needs.released-acceptance-gate.result != 'success'
    needs: [preflight, publish-pypi, promote-release, deploy-install-site, verify-promoted-public, verify-published-installer, released-acceptance-gate]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.candidate_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: candidate-public-state
          path: release-state
      - name: Demote exact failed release and restore prior latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m ci.public_release rollback release-state/candidate-public-state.json
      - name: Rebuild previous canonical installer Pages and preserve models
        run: |
          python -m installer.site site
          python -m models.preserve site
          python -m pip install 'git+https://github.com/zackees/manifest.json@main'
          manifest-validate site/install/manifest.json
          python -m installer.verify_site site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-rollback
          path: site
      - uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-rollback
      - name: Prove public prior pointer is restored
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            if python -m ci.public_release verify-rollback release-state/candidate-public-state.json; then exit 0; fi
            sleep 5
          done
          exit 1
