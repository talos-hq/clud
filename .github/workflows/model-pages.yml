name: Model Pages

on:
  pull_request:
    paths:
      - models/**
      - installer/**
      - tests/test_model_manifest.py
      - .github/workflows/model-pages.yml
      - .github/workflows/install-pages.yml
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'

concurrency:
  group: clud-pages-publication
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-site:
    name: Check and stage model Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      result: ${{ steps.stage.outputs.result }}
      public_digest: ${{ steps.digest.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Publisher unit tests
        run: |
          python -m pip install pytest running-process
          python -m pytest -q tests/test_model_manifest.py
      - name: Stage complete Pages artifact
        id: stage
        if: github.event_name != 'pull_request'
        run: |
          if [ "${{ github.event_name }}" = schedule ]; then trigger=nightly; else trigger=manual; fi
          python -m models.publish site --trigger "$trigger" --github-output "$GITHUB_OUTPUT"
      - name: Validate reused installer catalog and new model document
        if: steps.stage.outputs.result == 'publish'
        run: |
          python -m pip install 'git+https://github.com/zackees/manifest.json@main'
          manifest-validate site/install/manifest.json
          python -m pytest -q tests/test_model_manifest.py
          python -m json.tool site/models/manifest.json > /dev/null
      - name: Record staged Pages digest
        id: digest
        if: steps.stage.outputs.result == 'publish'
        run: echo "value=$(sha256sum site/index.html site/install/index.html site/install/manifest.json site/models/manifest.json | cut -d ' ' -f 1 | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Keep the model document for the release fallback
        if: steps.stage.outputs.result == 'publish'
        uses: actions/upload-artifact@v4
        with:
          name: models-manifest
          path: site/models/manifest.json
      - uses: actions/configure-pages@v5
        if: steps.stage.outputs.result == 'publish'
      - uses: actions/upload-pages-artifact@v3
        if: steps.stage.outputs.result == 'publish'
        with:
          path: site

  deploy-site:
    name: Deploy model Pages
    needs: build-site
    if: needs.build-site.outputs.result == 'publish'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke public model and installer manifests
        run: |
          mkdir -p public-site/install
          expected='${{ needs.build-site.outputs.public_digest }}'
          for attempt in $(seq 1 12); do
            actual=fetch-failed
            if curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 https://talosbot.ai/clud/models/manifest.json -o models.json &&
               curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 https://talosbot.ai/clud/index.html -o public-site/index.html &&
               curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 https://talosbot.ai/clud/install/index.html -o public-site/install/index.html &&
               curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 https://talosbot.ai/clud/install/manifest.json -o public-site/install/manifest.json; then
              actual=$(sha256sum public-site/index.html public-site/install/index.html public-site/install/manifest.json models.json | cut -d ' ' -f 1 | sha256sum | cut -d ' ' -f 1)
              if [ "$actual" = "$expected" ]; then
                break
              fi
            fi
            echo "Waiting for Pages propagation ($attempt/12): $actual"
            sleep 5
          done
          if [ "$actual" != "$expected" ]; then
            echo '::error::Public model Pages never matched the staged artifact' >&2
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          models = json.loads(Path('models.json').read_text(encoding='utf-8'))
          assert models['schema_version'] == 1
          assert models['defaults']['codex']['model'] == models['families']['sol']
          assert models['defaults']['codex']['effort'] == 'low'
          PY
          python -m installer.verify_site public-site

  # #2449: a GitHub-owned copy, so clud still finds the model document when the
  # custom domain is lost (releases/latest/download/models-manifest.json).
  publish-release-fallback:
    name: Publish model manifest release fallback
    needs: [build-site, deploy-site]
    if: needs.build-site.outputs.result == 'publish'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: models-manifest
      - name: Upload to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$(gh release view --json tagName --jq .tagName)
          cp manifest.json models-manifest.json
          gh release upload "$tag" models-manifest.json --clobber
