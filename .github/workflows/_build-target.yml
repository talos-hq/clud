name: Build target

# One triple in, one bundle out. This is the ONLY workflow in the repo that
# compiles Rust, and the only one that may build --release.

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact source commit for CI; defaults to caller SHA.
        required: false
        type: string
      target:
        description: Rust target triple.
        required: true
        type: string
      runs-on:
        description: Runner label. Every triple now cross-builds on ubuntu-24.04.
        required: false
        type: string
        default: ubuntu-24.04
      strategy:
        description: 'native | soldr'
        required: false
        type: string
        default: native
      profile:
        description: 'dev | release. release is gated to the Auto Release workflow.'
        required: false
        type: string
        default: dev
      clippy:
        description: Run cargo clippy --workspace --all-targets for this triple.
        required: false
        type: boolean
        default: true
      doctest:
        description: >-
          Run the workspace doc-tests (x86_64-unknown-linux-gnu only). CI runs
          them in the Linux x64 Clippy job, off the build job that every unit
          test lane waits on.
        required: false
        type: boolean
        default: false
      compile:
        description: Build the workspace binaries (and, with bundle, the test harnesses). Off only for a lint-only call.
        required: false
        type: boolean
        default: true
      save-cache:
        description: setup-soldr save-cache policy (auto | true | false). A caller that shares another job's cache namespace passes false so the two do not race to write one immutable key.
        required: false
        type: string
        default: auto
      bundle:
        description: Produce and upload a test bundle (bins + test harness binaries + dev wheel).
        required: false
        type: boolean
        default: true
      wheel-artifact:
        description: If non-empty, upload dist/* under this artifact name.
        required: false
        type: string
        default: ""
      standalone-artifact:
        description: If non-empty, build and upload one static musl clud binary only.
        required: false
        type: string
        default: ""
      candidate-artifact:
        description: If non-empty, build and upload one dev native PR candidate with provenance.
        required: false
        type: string
        default: ""
      include-sdist:
        description: Also build an sdist (exactly one target in the release matrix should set this).
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: ${{ inputs.target }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 60
    env:
      RUST_BACKTRACE: "1"
      # Incremental buys nothing on a fresh-checkout CI job -- there is no prior
      # incremental state to reuse -- while costing compile time and inflating
      # target/ by gigabytes, which directly worsens cache eviction pressure.
      CARGO_INCREMENTAL: "0"
      # See zackees/soldr#1879. Set at job level so every step, including the
      # composite's setup-soldr and the maturin-spawned cargo, sees it.
      SOLDR_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # whisper-rs-sys vendors `std::filesystem::path`, which requires macOS
      # 10.15+. Rust on stable defaults to 10.12, which fails the vendored C++
      # build. No-op off darwin. (Issue #13 follow-up.)
      MACOSX_DEPLOYMENT_TARGET: "10.15"
      # Strip DWARF from C/C++ deps to lower per-process RSS during compile.
      # Rust debuginfo is already trimmed in Cargo.toml [profile.*].
      CFLAGS: "-g0"
      CXXFLAGS: "-g0"
      CLUD_USE_SOLDR_SHIMS: "1"
      CARGO_TERM_COLOR: always
    steps:
      # Requirement (4): release builds belong to the release pipeline only.
      # `github.workflow_ref` identifies the calling workflow by repository,
      # path, and ref. Unlike the mutable display name, that makes the
      # containment rule unambiguous for future callers.
      - name: Guard release profile
        if: >-
          ${{ inputs.profile == 'release'
              && github.workflow_ref
                 != format('{0}/.github/workflows/auto-release.yml@{1}',
                           github.repository, github.ref) }}
        run: |
          echo "::error::profile=release requested by '${{ github.workflow_ref }}'."
          echo "Only the Auto Release workflow may build --release. CI builds dev."
          exit 1

      - name: Guard PR candidate isolation
        if: >-
          ${{ inputs.candidate-artifact != '' &&
              (inputs.profile != 'dev' || inputs.standalone-artifact != '' ||
               inputs.bundle || inputs.wheel-artifact != '' || inputs.include-sdist) }}
        run: |
          echo '::error::A PR candidate must be one dev-profile direct executable.'
          exit 1

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ inputs.source_ref || github.sha }}

      # #2078: a lint-only call (Clippy + doc-tests) is a pure function of the
      # tracked Rust inputs plus the files that run it (this workflow,
      # setup-build, ci/xbuild.py and its ci imports). Key an empty marker on
      # their blob OIDs and skip the whole job when main already passed that
      # exact input set; other ci/ and .github/ edits reuse it
      # (tests/test_pass_keys.py).
      - name: Compute pass key
        id: pass-key
        shell: bash
        env:
          LINT_ONLY: ${{ inputs.clippy && !inputs.compile && !inputs.bundle && inputs.wheel-artifact == '' && inputs.standalone-artifact == '' && inputs.candidate-artifact == '' }}
        # Every job computes a key so the lookup below always executes, which
        # the local-gate replay proof requires (zackees/ci.yml#415). A job that
        # is not lint-only gets a per-run key that never hits and never saves.
        run: |
          if [ "$LINT_ONLY" != "true" ]; then
            echo "key=pass-v1-none-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"
          digest=$(git ls-files -s | awk -F'\t' -v keep='.github/workflows/_build-target.yml .github/actions/setup-build/action.yml ci/__init__.py ci/xbuild.py ci/cargo_messages.py ci/process.py' 'BEGIN { n = split(keep, k, " "); for (i = 1; i <= n; i++) want[k[i]] = 1 } ($2 in want) || $2 ~ /^tests\/fixtures\// || ($2 !~ /^(docs|bench|tests|ci|\.github)\// && $2 !~ /^[^\/]*\.md$/ && $2 !~ /^(ci|local-gate|bosn)\.toml$/)' | sha256sum | cut -c1-16)
          echo "key=pass-v1-clippy-${{ inputs.target }}-${{ inputs.strategy }}-${{ inputs.doctest && 'doc' || 'nodoc' }}-${digest}" >> "$GITHUB_OUTPUT"

      - name: Look up pass marker
        id: pass
        uses: actions/cache/restore@v4
        with:
          path: .pass-marker
          key: ${{ steps.pass-key.outputs.key }}
          lookup-only: true

      # Runs unconditionally and branches inside: the local-gate replay proof
      # needs every declared step executed (zackees/ci.yml#415).
      - name: Skip unchanged inputs
        shell: bash
        env:
          CACHE_HIT: ${{ steps.pass.outputs.cache-hit }}
        run: |
          [ "$CACHE_HIT" = "true" ] || { echo "no pass marker; running the job"; exit 0; }
          echo "::notice::Clippy inputs unchanged since a passing main run; skipping."

      - name: Set up build
        if: ${{ steps.pass.outputs.cache-hit != 'true' }}
        uses: ./.github/actions/setup-build
        with:
          target: ${{ inputs.target }}
          strategy: ${{ inputs.strategy }}
          profile: ${{ inputs.profile }}
          soldr-token: ${{ secrets.GITHUB_TOKEN }}
          s3-access-key: ${{ secrets.SOLDR_S3_CACHE_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.SOLDR_S3_CACHE_SECRET_KEY }}
          save-cache: ${{ inputs.save-cache }}
          cook: ${{ inputs.compile }}

      # Every cargo/maturin invocation goes through ci/xbuild.py so the
      # per-strategy environment (zig wrappers, the SDKROOT/CMake plumbing on
      # top of what `soldr prepare` exported, the whisper-rs-sys host-cfg
      # workarounds documented in docs/architecture/ci.md) lives in one
      # testable place instead of being smeared across YAML.
      #
      # `$VENV_PY` rather than `uv run`: pyproject.toml:1-3 sets
      # build-backend = "soldr", so `uv run` syncs the project and triggers a
      # full PEP 517 maturin build of a HOST wheel before the TARGET build even
      # starts. See lint:8-24 for the pre-existing workaround this follows.
      - name: Clippy
        if: ${{ inputs.clippy && steps.pass.outputs.cache-hit != 'true' }}
        run: '"$VENV_PY" -m ci.xbuild clippy --target ${{ inputs.target }} --strategy ${{ inputs.strategy }}'

      - name: Build binaries and test harnesses
        if: ${{ inputs.compile && inputs.standalone-artifact == '' && inputs.candidate-artifact == '' }}
        run: >
          "$VENV_PY" -m ci.xbuild compile
          --target ${{ inputs.target }}
          --strategy ${{ inputs.strategy }}
          --profile ${{ inputs.profile }}
          ${{ inputs.bundle && '--with-tests' || '' }}

      - name: Build static musl clud
        if: ${{ inputs.standalone-artifact != '' }}
        run: >
          "$VENV_PY" -m ci.xbuild standalone
          --target ${{ inputs.target }}
          --strategy ${{ inputs.strategy }}
          --profile ${{ inputs.profile }}
          ${{ inputs.target == 'aarch64-unknown-linux-musl' && '--defer-native-version-check' || '' }}

      - name: Upload static musl clud
        if: ${{ inputs.standalone-artifact != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.standalone-artifact }}
          path: standalone/clud-*
          if-no-files-found: error
          compression-level: 0

      - name: Build native PR candidate
        if: ${{ inputs.candidate-artifact != '' }}
        run: >
          "$VENV_PY" -m ci.xbuild candidate
          --target ${{ inputs.target }}
          --strategy ${{ inputs.strategy }}
          --profile ${{ inputs.profile }}

      - name: Upload native PR candidate
        if: ${{ inputs.candidate-artifact != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.candidate-artifact }}
          overwrite: true
          path: candidate/*
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      # Doc-tests were covered by the old `cargo test --workspace`
      # (ci/test.py:137) but produce no harness binary, so they cannot ride
      # along in the bundle. They are architecture-independent, so running them
      # once on the host-arch x86_64 Linux triple is full coverage, not a
      # reduction. Keyed on the TRIPLE, not the strategy: #859 moved every
      # lane to the soldr strategy and a `strategy == 'native'` key silently
      # stopped running doc-tests anywhere (#863).
      # `test_doc_tests_run_on_a_live_matrix_triple` pins this key. They run
      # in the Clippy job (`doctest: true`), not the build job: the unit test
      # lanes start only when the build job completes, and the Clippy job
      # finishes over a minute before it, so this moves ~7 s off the PR's
      # critical path at no wall-clock cost.
      - name: Doc tests
        if: ${{ steps.pass.outputs.cache-hit != 'true' && inputs.doctest && inputs.target == 'x86_64-unknown-linux-gnu' && runner.os == 'Linux' }}
        run: '"$VENV_PY" -m ci.xbuild doctest --target ${{ inputs.target }} --strategy ${{ inputs.strategy }}'

      - name: Record pass marker
        if: ${{ success() && steps.pass.outputs.cache-hit != 'true' }}
        shell: bash
        env:
          RECORD: ${{ steps.pass-key.outputs.eligible == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          [ "$RECORD" = "true" ] || { echo "only a keyed main push records a pass marker"; exit 0; }
          mkdir -p .pass-marker
          touch .pass-marker/ok

      - name: Save pass marker
        if: ${{ success() && steps.pass-key.outputs.eligible == 'true' && steps.pass.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: .pass-marker
          key: ${{ steps.pass-key.outputs.key }}

      # This ZIP is the pinned portable build of zackees/wezterm at
      # 9b39ad5eb8552b20932323fe2afefdb0fa9ad68d. The fetcher checks both
      # the archive digest and its SOURCE_REVISION before exposing the bundle.
      - name: Fetch Kitty Windows x64 bundle
        if: ${{ inputs.target == 'x86_64-pc-windows-msvc' && (inputs.bundle || inputs.wheel-artifact != '') }}
        run: |
          "$VENV_PY" -m ci.fetch_kitty_bundle \
            --url https://github.com/zackees/wezterm/releases/download/kitty-windows-compat-9b39ad5e/WezTerm-windows-portable.zip \
            --sha256 8ba9d0c7a79ce9380108a09cc91bf415ac6c92da669483ee740820fb34556bf7 \
            --dest "$RUNNER_TEMP/clud-kittyterm-bundle"
          echo "CLUD_KITTYTERM_BUNDLE_DIR=$RUNNER_TEMP/clud-kittyterm-bundle" >> "$GITHUB_ENV"

      - name: Build wheel
        if: ${{ inputs.bundle || inputs.wheel-artifact != '' }}
        run: >
          "$VENV_PY" -m ci.xbuild wheel
          --target ${{ inputs.target }}
          --strategy ${{ inputs.strategy }}
          --profile ${{ inputs.profile }}

      # Issue #1017: 2.7.2, 2.7.3 and 2.7.4 were tagged and built green, and
      # none of them published -- a linux wheel had grown past PyPI's 100 MB
      # per-file limit, and because `publish-release` is skipped when
      # `publish-pypi` fails, the tag produced nothing and looked like it had
      # succeeded. Nothing measured the wheels, so nothing said so.
      #
      # The cap is enforced only for `release`, because PyPI only ever sees
      # release wheels and a dev wheel's size says nothing about theirs.
      # Sizes are printed either way, so growth is visible in any build log.
      - name: Check wheel size
        if: ${{ inputs.bundle || inputs.wheel-artifact != '' }}
        run: >
          "$VENV_PY" -m ci.check_wheel_size --dist-dir dist/
          ${{ inputs.profile == 'release' && inputs.target == 'x86_64-unknown-linux-gnu' && '--max-mb 20' || inputs.profile == 'release' && '--max-mb 90' || '' }}

      # #1544/#1545: pip installs `.data/scripts/*` with the zip entry's mode,
      # and 2.8.14/2.8.20 shipped them 0644. Same condition as the size check,
      # so the release (`wheel-artifact`) path is gated too.
      - name: Check wheel script modes
        if: ${{ inputs.bundle || inputs.wheel-artifact != '' }}
        run: '"$VENV_PY" -m ci.check_wheel_modes --dist-dir dist/'

      - name: Build sdist
        if: ${{ inputs.include-sdist }}
        run: '"$VENV_PY" -m maturin sdist --out dist'

      # Guards a real regression class: the shipped Windows exes must not import
      # the MinGW runtime (ci/check_windows_wheel.py:29-35). The soldr cross
      # path targets MSVC, but the check is cheap and now also catches a
      # mis-selected -gnu target, which is a new failure mode the native build
      # could not have had.
      - name: Verify Windows wheel has no MinGW runtime imports
        if: ${{ contains(inputs.target, 'windows') && (inputs.bundle || inputs.wheel-artifact != '') }}
        run: >
          "$VENV_PY" -m ci.check_windows_wheel --dist-dir dist/
          ${{ inputs.profile == 'release' && '--no-debug-symbols' || '' }}

      - name: Pack bundle
        if: ${{ inputs.bundle }}
        run: >
          "$VENV_PY" -m ci.bundle pack
          --target ${{ inputs.target }}
          --profile ${{ inputs.profile }}
          --dest bundle-archive

      - name: Upload bundle
        if: ${{ inputs.bundle }}
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ inputs.target }}
          path: bundle-archive/*
          if-no-files-found: error
          retention-days: 3
          compression-level: 0 # already zstd-compressed by ci.bundle

      - name: Upload dist artifacts
        if: ${{ inputs.wheel-artifact != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.wheel-artifact }}
          path: dist/*
          if-no-files-found: error

      # Sidecar debug info (`.dwp`), staged by ci/xbuild.py::collect_debuginfo
      # into dist-debuginfo/ rather than dist/. That separation is what keeps
      # it off PyPI: only dist/* becomes a `wheels-*` artifact, and `wheels-*`
      # is the only pattern publish-pypi downloads into its packages-dir.
      # `ignore` rather than `error`: a target that produces no .dwp (MSVC,
      # Apple) must not fail the release. The collector logs each file's path
      # and size, so an unexpected absence is visible in this job's log.
      - name: Upload debug info
        if: ${{ inputs.wheel-artifact != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: debuginfo-${{ inputs.target }}
          path: dist-debuginfo/*
          if-no-files-found: ignore

      - name: Diagnose Linux build failure
        if: ${{ failure() && runner.os == 'Linux' }}
        shell: bash
        run: |
          set +e
          echo "::group::OOM / killed-process scan"
          (sudo dmesg 2>/dev/null || dmesg 2>/dev/null) | grep -iE 'killed|oom|out of memory|signal 9' | tail -50
          [ $? -ne 0 ] && echo "(no OOM/kill messages found)"
          echo "::endgroup::"
          echo "::group::Last 100 dmesg lines"
          (sudo dmesg 2>/dev/null || dmesg 2>/dev/null) | tail -100
          echo "::endgroup::"
          echo "::group::Memory snapshot"; free -h; echo "::endgroup::"
          echo "::group::Disk snapshot"; df -h; echo "::endgroup::"

      - name: Upload failure logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs-build-${{ inputs.target }}
          path: logs/*
          if-no-files-found: warn
