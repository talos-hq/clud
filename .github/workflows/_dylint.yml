name: Dylint

# Linux Dylint, called from ci.yml under its concurrency group: the host pass
# and the Windows MSVC / macOS arm64 cross-check passes run as parallel legs
# of one Linux matrix (#2061). Run back to back they made Dylint the slowest
# required job once the build's dependency cook went warm.

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact source commit for the full CI run.
        required: false
        type: string
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Ignore stale developer/runner PATH installs and select Soldr's blessed
  # precompiled cargo-dylint, dylint-link, and matching driver as one unit.
  SOLDR_FORCE_MANAGED_CARGO_SUBCOMMANDS: "1"
  # This crate uses Dylint's legacy bare rust-toolchain file. Soldr's
  # preparer reads rust-toolchain.toml, so select the same nightly explicitly.
  SOLDR_DYLINT_TOOLCHAIN: nightly-2026-08-15
  # See zackees/soldr#1879 -- authenticates soldr's cross-repo managed-tool
  # lookups so they are not rate-limited to 60 req/hr per runner IP.
  SOLDR_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  dylint:
    name: Dylint (${{ matrix.pass }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        pass: [host, x86_64-pc-windows-msvc, aarch64-apple-darwin]
    timeout-minutes: 30
    env:
      # Steps branch on this inside their scripts rather than a step-level
      # `if:`: the local-gate replay proof needs every declared step to
      # execute in every leg (zackees/ci.yml#415).
      DYLINT_PASS: ${{ matrix.pass }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ inputs.source_ref || github.sha }}
      # Pass marker (#2078, prototype of zackees/soldr#3890): skip the leg
      # before any setup when this exact input tree already passed it. The
      # key hashes the git blob IDs of every tracked file Dylint can read plus
      # the leg: the Rust-lane excludes from local-gate.toml, and also ci/,
      # .github/ and the CI config tomls except this file, so the pinned
      # nightly/Dylint versions are part of it while a CI-only change reuses
      # the marker (tests/test_pass_keys.py). The
      # marker is an empty cache entry: the key is the only metadata.
      # Known gap until soldr#3890: soldr itself floats on `v0`/latest and is
      # not in the key.
      - name: Compute pass key
        id: pass-key
        run: |
          digest=$(git ls-files -s | awk -F'\t' -v keep='.github/workflows/_dylint.yml' 'BEGIN { n = split(keep, k, " "); for (i = 1; i <= n; i++) want[k[i]] = 1 } ($2 in want) || $2 ~ /^tests\/fixtures\// || ($2 !~ /^(docs|bench|tests|ci|\.github)\// && $2 !~ /^[^\/]*\.md$/ && $2 !~ /^(ci|local-gate|bosn)\.toml$/)' | sha256sum | cut -c1-16)
          echo "key=pass-v1-dylint-${{ matrix.pass }}-${digest}" >> "$GITHUB_OUTPUT"
      - name: Look up pass marker
        id: pass
        uses: actions/cache/restore@v4
        with:
          path: .pass-marker
          key: ${{ steps.pass-key.outputs.key }}
          lookup-only: true
      - name: Skip unchanged inputs
        env:
          CACHE_HIT: ${{ steps.pass.outputs.cache-hit }}
        run: |
          [ "$CACHE_HIT" = "true" ] || { echo "no pass marker; running the leg"; exit 0; }
          echo "::notice::Dylint ${{ matrix.pass }} already passed for ${{ steps.pass-key.outputs.key }}; skipping"
      - name: Set up soldr
        if: steps.pass.outputs.cache-hit != 'true'
        uses: forge-ci/setup-soldr@v0
        env:
          # Remote S3 build cache credentials; absent secrets disable it.
          SOLDR_S3_CACHE_ACCESS_KEY: ${{ secrets.SOLDR_S3_CACHE_ACCESS_KEY }}
          SOLDR_S3_CACHE_SECRET_KEY: ${{ secrets.SOLDR_S3_CACHE_SECRET_KEY }}
        with:
          # Remote S3 build cache: bucket forge-ci in DigitalOcean Spaces nyc3.
          # The 50G high watermark is enforced only on the merge-queue
          # (merge_group) singleton; unset bucket/creds disables it entirely.
          s3-bucket: forge-ci
          s3-endpoint: nyc3.digitaloceanspaces.com
          s3-region: nyc3
          s3-cache-limit: 50G
          cache: true
          # #2300 / setup-soldr#473: the solo-toolchain cache cold path fails
          # with "repaired a poisoned restore but has no replacement manifest".
          solo-toolchain-cache: false
          # setup-soldr#559: a failed or cancelled job saves no build outputs
          # (its store may be partial; an exact-hit key is never re-saved).
          job-status: ${{ job.status }}
          toolchain: 1.95.0
          dylint-toolchain: nightly-2026-08-15
          dylint: true
          cargo-dylint-version: 6.2.0
          dylint-link-version: 6.2.0
          # zccache keeps each target's nightly check-mode dependency units
          # (saved from main only). Warm passes check just workspace crates.
          # One key per leg: the legs check different targets, and a shared
          # key would let three writers race for one immutable entry.
          cache-key-suffix: dylint-zccache-${{ matrix.pass }}
          prebuild-deps: none
          linker: platform-default
          cache-payload-warn-bytes: 2GiB
      # setup-soldr's cargo-registry cache restores extracted crate sources
      # without non-source `.tar` payloads, so `dylint_internal`'s
      # `include_bytes!("template.tar")` (pulled in by `dylint_testing` for
      # the UI tests) fails. Drop such incomplete extractions so cargo
      # re-unpacks them from the `.crate` archive. Same repair as fbuild.
      - name: Repair registry sources missing packaged files
        if: steps.pass.outputs.cache-hit != 'true'
        run: |
          for src in "$HOME"/.cargo/registry/src/*/dylint_internal-*; do
            [ -d "$src" ] || continue
            if [ ! -f "$src/template.tar" ]; then
              echo "::warning::re-extracting $(basename "$src"): template.tar missing from restored registry cache"
              rm -rf "$src"
            fi
          done
      - name: Prepare verified Dylint prebuilts
        if: steps.pass.outputs.cache-hit != 'true'
        run: |
          env -u RUSTUP_TOOLCHAIN soldr dylint prepare 2>&1 | tee "$RUNNER_TEMP/dylint-prepare.log"
          sed -n 's/^soldr: dylint prepare: tool bin dir //p' "$RUNNER_TEMP/dylint-prepare.log" >> "$GITHUB_PATH"
      - name: Check dylint formatting
        if: steps.pass.outputs.cache-hit != 'true'
        run: |
          [ "$DYLINT_PASS" = "host" ] || { echo "not the host leg"; exit 0; }
          soldr rustup component add --toolchain nightly-2026-08-15 rustfmt
          (cd dylints/ban_manual_slash_normalize && soldr --no-cache cargo fmt --all -- --check)
          (cd dylints/enforce_platform_boundary && soldr --no-cache cargo fmt --all -- --check)
      - name: Test dylint crate
        if: steps.pass.outputs.cache-hit != 'true'
        run: |
          [ "$DYLINT_PASS" = "host" ] || { echo "not the host leg"; exit 0; }
          # Run from the crate so its .cargo/config.toml applies (RUST-016).
          (cd dylints/ban_manual_slash_normalize && RUSTUP_TOOLCHAIN=nightly-2026-08-15 soldr --no-cache cargo test)
          # enforce_platform_boundary's UI test (`ui/boundary.rs`) launches
          # nested Cargo through dylint_testing, outside soldr's Dylint front
          # door: keep the rustup proxy visible and point the runner at the
          # verified driver setup-soldr exported. The runner asks for the
          # short nightly directory; soldr 0.9.47+ stages the driver under
          # both names, and the toolchain still needs the short alias.
          export PATH="${CARGO_HOME:-$HOME/.cargo}/bin:${PATH}"
          : "${DYLINT_DRIVER_PATH:?}"
          host="$(RUSTUP_TOOLCHAIN=nightly-2026-08-15 soldr rustc -vV | sed -n 's/^host: //p')"
          qualified="nightly-2026-08-15-${host}"
          test -f "$DYLINT_DRIVER_PATH/$qualified/dylint-driver"
          test -d "${RUSTUP_HOME:?}/toolchains/$qualified"
          test -f "$DYLINT_DRIVER_PATH/nightly-2026-08-15/dylint-driver"
          ln -sfnT "$qualified" "$RUSTUP_HOME/toolchains/nightly-2026-08-15"
          (cd dylints/enforce_platform_boundary && \
            RUSTUP_TOOLCHAIN=nightly-2026-08-15 CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/dylint-tests" \
            soldr cargo test)
      - name: Run dylint over workspace
        if: steps.pass.outputs.cache-hit != 'true'
        run: |
          [ "$DYLINT_PASS" = "host" ] || { echo "not the host leg"; exit 0; }
          env -u RUSTUP_TOOLCHAIN soldr dylint --all -- --workspace --all-targets
      # Late lints only see code that compiles for the checked target, so the
      # host pass never reaches `cfg(windows)` / `cfg(target_os = "macos")`
      # code. These check-only passes cover it from Linux with the same
      # prebuilt driver; soldr installs the nightly's target `rust-std`.
      - name: Run dylint for x86_64-pc-windows-msvc
        if: steps.pass.outputs.cache-hit != 'true'
        # Scoped to the check-only cross passes: a warning only this target
        # sees (an import unused off-Linux, #1837) must fail here (#1849).
        env:
          RUSTFLAGS: -D warnings
        run: |
          [ "$DYLINT_PASS" = "x86_64-pc-windows-msvc" ] || { echo "not the x86_64-pc-windows-msvc leg"; exit 0; }
          env -u RUSTUP_TOOLCHAIN soldr dylint prepare --target x86_64-pc-windows-msvc
          env -u RUSTUP_TOOLCHAIN soldr dylint --all -- --workspace --all-targets --target x86_64-pc-windows-msvc
      - name: Run dylint for aarch64-apple-darwin
        if: steps.pass.outputs.cache-hit != 'true'
        # Scoped to the check-only cross passes: a warning only this target
        # sees (an import unused off-Linux, #1837) must fail here (#1849).
        env:
          RUSTFLAGS: -D warnings
        run: |
          [ "$DYLINT_PASS" = "aarch64-apple-darwin" ] || { echo "not the aarch64-apple-darwin leg"; exit 0; }
          # #2115: a restored rustup-home can claim this target's rust-std
          # while its library files are missing. soldr checks the files and
          # refuses to repair caller-selected state, and rustup still reports
          # the component "up to date". Delete the broken toolchain so soldr
          # reinstalls it whole on its next call. A healthy cache is a no-op.
          for dir in "${RUSTUP_HOME:?}"/toolchains/*/; do
            [ -L "${dir%/}" ] && continue
            grep -qx rust-std-aarch64-apple-darwin "${dir}lib/rustlib/components" 2>/dev/null || continue
            ls "${dir}lib/rustlib/aarch64-apple-darwin/lib/"libcore-*.rlib >/dev/null 2>&1 && continue
            echo "::warning::reinstalling $(basename "$dir"): its aarch64-apple-darwin rust-std files are missing (#2115)"
            rm -rf "${dir%/}"
          done
          env -u RUSTUP_TOOLCHAIN soldr dylint prepare --target aarch64-apple-darwin
          env -u RUSTUP_TOOLCHAIN soldr dylint --all -- --workspace --all-targets --target aarch64-apple-darwin
      - name: Record pass marker
        if: success() && steps.pass.outputs.cache-hit != 'true'
        env:
          RECORD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          [ "$RECORD" = "true" ] || { echo "only main pushes record a pass marker"; exit 0; }
          mkdir -p .pass-marker
          touch .pass-marker/ok
      - name: Save pass marker
        if: >-
          success() && steps.pass.outputs.cache-hit != 'true'
          && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .pass-marker
          key: ${{ steps.pass-key.outputs.key }}
