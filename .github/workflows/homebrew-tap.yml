name: Homebrew tap

# A downstream package channel, deliberately outside Auto Release (DD-223):
# a tap failure must never turn a completed release red, and it must be
# retryable on its own. This workflow only reads the release; it never gates,
# re-runs or changes it.
on:
  # Auto Release promotes with GITHUB_TOKEN, and GitHub starts no workflow for
  # a release event made by that token. Completion of the release run is the
  # automatic trigger; the job takes the tag from that run (its head_branch),
  # never from releases/latest, which can lag the promotion. A failed or
  # rolled-back run, or a proof run without a stable release, is a no-op.
  workflow_run:
    workflows: [Auto Release]
    types: [completed]
  # A promotion to stable made by a person or a non-GITHUB_TOKEN credential.
  # `released` never fires for a prerelease, and the job re-checks the state.
  release:
    types: [released]
  # Manual repair: render and push the formula for one stable tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable release tag whose formula the tap should carry (e.g. 2.8.68)."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: homebrew-tap
  cancel-in-progress: false

jobs:
  update-tap:
    name: Update the Homebrew tap formula
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Resolve the stable release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          # Auto Release is dispatched on (or pushed as) the tag, so the run's
          # head_branch is the tag it released, e.g. 2.8.69.
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          skip() { echo "$1"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; }
          # Never read the latest-release endpoint: right after promotion it can
          # still return the previous one (2.8.69's run read 2.8.68). Each path
          # names its tag, and that one release is checked directly.
          case "$EVENT" in
            workflow_dispatch) tag="$DISPATCH_TAG" ;;
            release) tag="$EVENT_TAG" ;;
            workflow_run)
              # A failed run, including one whose rollback-public demoted the
              # release, leaves the tap alone.
              [ "$RUN_CONCLUSION" = success ] || skip "Auto Release concluded '$RUN_CONCLUSION'; the tap is left alone"
              tag="$RUN_TAG" ;;
            *) echo "::error::unexpected event $EVENT"; exit 1 ;;
          esac
          test -n "$tag" || { echo "::error::no release tag to publish"; exit 1; }
          if ! state=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '"\(.draft) \(.prerelease)"'); then
            # A proof run on a branch has no release; dispatch with the tag to repair.
            [ "$EVENT" = workflow_run ] && skip "::warning::$tag has no GitHub Release; nothing to publish (dispatch this workflow with the tag to repair)"
            echo "::error::$tag has no GitHub Release"
            exit 1
          fi
          if [ "$state" != "false false" ]; then
            msg="$tag is not a published stable release (draft prerelease = $state); the tap only carries stable releases"
            [ "$EVENT" = workflow_run ] && skip "$msg"
            echo "::error::$msg"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # The formula generator is read at the release tag, not at main.
      - uses: actions/checkout@v4
        if: steps.tag.outputs.skip == 'false'
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
      - uses: actions/setup-python@v5
        if: steps.tag.outputs.skip == 'false'
        with:
          python-version: "3.13"
      - name: Render Formula/clud.rb from the tag's SHA256SUMS
        if: steps.tag.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS --dir "$RUNNER_TEMP/release-sums"
          python -m installer.homebrew_formula "$RELEASE_TAG" "$RUNNER_TEMP/release-sums/SHA256SUMS" > "$RUNNER_TEMP/clud.rb"
          cat "$RUNNER_TEMP/clud.rb"

      # The tap is public: an unchanged formula needs no write credential, so a
      # no-op succeeds even while the App is not installed on the tap. A formula
      # older than the tap's is never pushed, so a stale or late run cannot
      # roll the tap back; only a dispatch reports that as a failure.
      - name: Compare with the published tap formula
        id: diff
        if: steps.tag.outputs.skip == 'false'
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git clone --depth 1 https://github.com/talos-hq/homebrew-tap.git "$RUNNER_TEMP/tap"
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          tmp = Path(os.environ["RUNNER_TEMP"])
          tag = os.environ["RELEASE_TAG"]
          rendered = (tmp / "clud.rb").read_text()
          tap_file = tmp / "tap" / "Formula" / "clud.rb"
          published = tap_file.read_text() if tap_file.exists() else ""
          pattern = r"/releases/download/v?(\d+)\.(\d+)\.(\d+)/"
          ours = tuple(map(int, re.fullmatch(r"v?(\d+)\.(\d+)\.(\d+)", tag).groups()))
          theirs = max((tuple(map(int, m)) for m in re.findall(pattern, published)), default=None)
          if rendered == published:
              print(f"Formula already at {tag}; nothing to push")
              changed = "false"
          elif theirs is not None and ours < theirs:
              have = ".".join(map(str, theirs))
              msg = f"refusing to downgrade the tap from {have} to {tag}"
              if os.environ["EVENT"] == "workflow_dispatch":
                  raise SystemExit(f"::error::{msg}")
              print(f"::warning::{msg}")
              changed = "false"
          else:
              changed = "true"
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"changed={changed}\n")
          PY

      # Same clud-refresh App as the catalog refresh jobs: a token that lives
      # at most an hour, scoped to the tap repo, and no PAT to rotate.
      - name: Mint tap App token
        id: tap-app
        if: steps.diff.outputs.changed == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          app-id: ${{ vars.CLUD_REFRESH_APP_ID }}
          private-key: ${{ secrets.CLUD_REFRESH_APP_PRIVATE_KEY }}
          owner: talos-hq
          repositories: homebrew-tap
      - name: Explain a missing tap credential
        if: steps.diff.outputs.changed == 'true' && steps.tap-app.outcome != 'success'
        run: |
          echo "::error title=Homebrew tap credential::Could not mint a token for talos-hq/homebrew-tap. Install the clud-refresh GitHub App on talos-hq/homebrew-tap (org settings > GitHub Apps > clud-refresh > Repository access), and check that vars.CLUD_REFRESH_APP_ID and secrets.CLUD_REFRESH_APP_PRIVATE_KEY are set on talos-hq/clud. Then re-run this workflow or dispatch it with the tag. The release itself is unaffected."
          exit 1

      - name: Push the formula to talos-hq/homebrew-tap
        if: steps.diff.outputs.changed == 'true' && steps.tap-app.outcome == 'success'
        env:
          TAP_TOKEN: ${{ steps.tap-app.outputs.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          cd "$RUNNER_TEMP/tap"
          mkdir -p Formula
          cp "$RUNNER_TEMP/clud.rb" Formula/clud.rb
          git add Formula/clud.rb
          git config user.name "clud-refresh-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "clud $RELEASE_TAG"
          git push "https://x-access-token:${TAP_TOKEN}@github.com/talos-hq/homebrew-tap.git" HEAD:main
