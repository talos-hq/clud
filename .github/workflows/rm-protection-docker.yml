name: RM protection (Docker)

# Recording-stub corpus plus a real GNU bind-mount probe. Hazardous corpus
# operands never reach a real removal executable; only disposable fixture
# paths are ever handed to /bin/rm.

on:
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SOLDR_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  rm-protection:
    name: child removal floor
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-build
        with:
          target: x86_64-unknown-linux-gnu
          strategy: native
          soldr-token: ${{ secrets.GITHUB_TOKEN }}
          s3-access-key: ${{ secrets.SOLDR_S3_CACHE_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.SOLDR_S3_CACHE_SECRET_KEY }}

      - name: Ensure the native linker is installed
        run: |
          if ! command -v clang >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y clang
          fi

      - name: Build clud and link its argv[0] aliases (#1551)
        run: |
          set -euo pipefail
          soldr cargo build -p clud --bin clud
          for dir in target/debug target/x86_64-unknown-linux-gnu/debug; do
            if [ -x "$dir/clud" ]; then
              "$dir/clud" __link-aliases "$dir"
            fi
          done

      - name: Locate the binaries
        id: binary
        run: |
          set -euo pipefail
          for candidate in \
            target/debug/clud-cmd-scan \
            target/x86_64-unknown-linux-gnu/debug/clud-cmd-scan; do
            if [ -x "$candidate" ]; then
              echo "hook=$candidate" >> "$GITHUB_OUTPUT"
              echo "shim=$(dirname "$candidate")/clud-shim" >> "$GITHUB_OUTPUT"
              echo "clud=$(dirname "$candidate")/clud" >> "$GITHUB_OUTPUT"
              echo "using $candidate"
              exit 0
            fi
          done
          echo "hook binary not found after compile" >&2
          exit 1

      - name: Name the disposable image
        id: image
        run: echo "tag=clud-rm-protection:$(hostname)" >> "$GITHUB_OUTPUT"

      - name: Build the disposable check image
        run: >
          docker build
          -f ci/docker/rm_protection/Dockerfile
          --build-arg BASE=ubuntu:24.04
          --build-arg CLUD_BINARY=${{ steps.binary.outputs.clud }}
          --build-arg HOOK_BINARY=${{ steps.binary.outputs.hook }}
          --build-arg SHIM_BINARY=${{ steps.binary.outputs.shim }}
          -t ${{ steps.image.outputs.tag }}
          .

      - name: Verify the legacy corpus through a recording handoff stub
        run: >
          docker run --rm
          --network none
          --read-only
          --cap-drop ALL
          --security-opt no-new-privileges
          --tmpfs /tmp:rw,exec,nosuid,mode=1777
          --tmpfs /home/checker:rw,noexec,nosuid,uid=10001,gid=10001,mode=0700
          ${{ steps.image.outputs.tag }}

      - name: Verify real GNU removal cannot cross a bind mount
        run: |
          set -euo pipefail
          probe_volume="$(docker volume create)"
          trap 'docker volume rm "$probe_volume" >/dev/null' EXIT
          docker run --rm --user 0:0 \
            --mount "type=volume,source=$probe_volume,target=/seed" \
            --entrypoint /usr/bin/touch ${{ steps.image.outputs.tag }} /seed/CLAUDE.md
          probe_source="$(docker volume inspect --format '{{ .Mountpoint }}' "$probe_volume")"
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,exec,nosuid,mode=1777 \
            --tmpfs /home/checker:rw,noexec,nosuid,uid=10001,gid=10001,mode=0700 \
            --tmpfs /mount-probe:rw,exec,nosuid,uid=10001,gid=10001,mode=0700 \
            -e RM_REQUIRE_MOUNT_PROBE=1 \
            --mount "type=bind,source=$probe_source,target=/mount-probe/parent/mounted,readonly" \
            ${{ steps.image.outputs.tag }} \
            python -m pytest -p no:cacheprovider -q tests/test_mount_floor.py

      - name: Discard the disposable image
        if: always() && steps.image.outputs.tag != ''
        run: docker rmi "${{ steps.image.outputs.tag }}"
