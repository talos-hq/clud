name: Run tests

# Executes a prebuilt bundle on a native runner. Compiles nothing -- see
# .github/actions/setup-exec, which poisons cargo/rustc on PATH so a test that
# regresses into building from source fails loudly instead of quietly burning
# ten minutes of scarce macOS/Windows runner time.

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact source commit matching the downloaded bundle.
        required: false
        type: string
      target:
        description: Rust target triple the bundle was built for.
        required: true
        type: string
      runs-on:
        description: Native runner label that can execute this triple.
        required: true
        type: string
      suite:
        description: 'unit | integration | harness | wheel-smoke'
        required: true
        type: string
      shard:
        description: >-
          all (default) | rust | py<k>of<n>. The Linux x64 unit suite and the
          macOS x64 integration suite run as parallel shards (ci/pytest_shard.py);
          every other lane is "all".
        required: false
        type: string
        default: all
      wheel-artifact:
        description: >-
          wheel-smoke only: artifact holding the release wheel to pip-install
          into a fresh venv and smoke (#1545). No bundle is downloaded.
        required: false
        type: string
        default: ""

jobs:
  test:
    name: ${{ inputs.target }} ${{ inputs.suite }}
    runs-on: ${{ inputs.runs-on }}
    # Tighter than the old 45: this job only executes prebuilt binaries, and
    # pytest's own per-test `timeout = 90` (pyproject.toml) should catch a
    # hang long before this does. A lower ceiling halves what a wedged job
    # costs in scarce macOS/Windows runner time. When it does fire, the
    # per-line tee in ci/run_bundle.py plus the always()-uploaded artifact
    # below are what name the wedged test (#1168).
    timeout-minutes: 20
    env:
      RUST_BACKTRACE: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Set up execution
        uses: ./.github/actions/setup-exec
        with:
          bundle-name: ${{ inputs.suite != 'wheel-smoke' && format('bundle-{0}', inputs.target) || '' }}
          # Only the Python GUI tests use the native-window packages, and
          # ci/pytest_shard.py pins them to the first shard, so the other
          # shards skip the 117 MB apt install (#2054).
          native-window-runtime: ${{ inputs.shard == 'all' || inputs.shard == 'py1of3' }}

      - name: Download release wheel
        if: inputs.suite == 'wheel-smoke'
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.wheel-artifact }}
          path: release-wheel

      # Real pip in a fresh venv, on the exact bytes that publish (#1545).
      - name: Install-smoke release wheel
        if: inputs.suite == 'wheel-smoke'
        shell: bash
        run: '"$VENV_PY" -m ci.wheel_smoke --wheel-dir release-wheel'

      # ci/run_bundle.py reconstructs the layout the existing tests already
      # expect rather than making the tests learn a new one:
      #   CLUD_TEST_BINARY / _BLOCK_BAD_CMD_BINARY / _MOCK_AGENT_BINARY
      #     -> honored first by every Python test
      #        (tests/test_hello.py:58, tests/integration/conftest.py:181-200)
      #   CARGO_TARGET_DIR -> read at *runtime* by
      #        crates/clud-bin/tests/integration/common/mod.rs:33, so mock_agent_path()
      #        resolves for pty_pump/pty_behavior/orphan_reap with no source
      #        change, and the zombie-scan fixture stops no-oping.
      #   CLUD_TEST_BIN_DIR -> the runtime override for the CARGO_BIN_EXE_*
      #        paths baked in at compile time (see docs/architecture/ci.md).
      #
      # `$VENV_PY` rather than `uv run`: pyproject.toml:1-3 sets
      # build-backend = "soldr", so `uv run` would sync the project and trigger
      # a PEP 517 maturin build -- which on this runner hits the removed
      # toolchain and fails every job. See lint:8-24.
      # #1323: the harness suite drives the real Claude Code, pinned so the
      # request shapes the mock backend speaks stay fixed.
      # zackees/ci.yml#404: install into a job-private prefix, never the
      # Node toolcache. The toolcache is shared, read-only state that a job
      # need not own (non-root local runners get EACCES there); a
      # $RUNNER_TEMP prefix behaves identically on every runner.
      - name: Install pinned Claude Code
        if: inputs.suite == 'harness'
        shell: bash
        run: |
          prefix="$RUNNER_TEMP/clud-npm-global"
          mkdir -p "$prefix"
          npm install --global --prefix "$prefix" @anthropic-ai/claude-code@2.1.306
          echo "$prefix/bin" >> "$GITHUB_PATH"
          "$prefix/bin/claude" --version

      - name: Install pinned GitLab CLI for secret acceptance
        if: inputs.suite == 'unit'
        shell: bash
        run: >-
          "$VENV_PY" -m ci.install_glab
          --target "${{ inputs.target }}"
          --destination "$RUNNER_TEMP/clud-glab"
          --github-env "$GITHUB_ENV"

      # Run the focused GUI check before the broad integration suite, which can
      # hang independently. setup-exec has unpacked the wheel into bundle/dist.
      - name: Smoke installed Kitty GUI headlessly
        if: ${{ inputs.target == 'x86_64-pc-windows-msvc' && inputs.suite == 'integration' }}
        shell: pwsh
        run: |
          $wheels = @(Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'bundle/dist') -Filter '*.whl' -File)
          if ($wheels.Count -ne 1) { throw "Expected one bundled wheel, found $($wheels.Count)" }
          $wheel = $wheels[0]
          uv pip install --python (Join-Path $env:GITHUB_WORKSPACE '.venv/Scripts/python.exe') --reinstall --no-deps $wheel.FullName
          if ($LASTEXITCODE -ne 0) { throw "Wheel install failed with exit $LASTEXITCODE" }
          $manifest = Get-Content -Raw -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'bundle/manifest.json') | ConvertFrom-Json
          $mockAgent = Join-Path $env:GITHUB_WORKSPACE "bundle/target/$($manifest.profile_dir)/mock-agent.exe"
          pwsh -NoProfile -File ci/kitty_windows_smoke.ps1 `
            -ScriptsDir (Join-Path $env:GITHUB_WORKSPACE '.venv/Scripts') `
            -MockAgentPath $mockAgent
          if ($LASTEXITCODE -ne 0) { throw "Kitty GUI smoke failed with exit $LASTEXITCODE" }

      - name: Run ${{ inputs.suite }} suite
        if: inputs.suite != 'wheel-smoke'
        shell: bash
        run: '"$VENV_PY" -m ci.run_bundle --bundle bundle --suite ${{ inputs.suite }} --shard ${{ inputs.shard }}'

      - name: Diagnose Linux failure
        if: ${{ failure() && runner.os == 'Linux' }}
        shell: bash
        run: |
          set +e
          echo "::group::OOM / killed-process scan"
          (sudo dmesg 2>/dev/null || dmesg 2>/dev/null) | grep -iE 'killed|oom|out of memory|signal 9' | tail -50
          [ $? -ne 0 ] && echo "(no OOM/kill messages found)"
          echo "::endgroup::"
          echo "::group::Memory snapshot"; free -h; echo "::endgroup::"

      # `always()`, not `failure()`: a job cancelled at the ceiling above is
      # neither, and its step log is discarded, so `logs/pytest-<suite>.log`
      # (teed by ci/run_bundle.py) is the only record of which test wedged
      # (#1168). Skips itself when there is nothing to upload.
      - name: Upload failure logs
        if: ${{ always() && (failure() || cancelled()) }}
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs-${{ inputs.suite }}-${{ inputs.target }}${{ inputs.shard != 'all' && format('-{0}', inputs.shard) || '' }}
          path: |
            logs/*
            bundle/manifest.json
          if-no-files-found: warn
