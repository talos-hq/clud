name: CI
run-name: ${{ github.event_name == 'workflow_dispatch' && format('CI full {0}', inputs.candidate_sha) || 'CI' }}

# The single push/PR entrypoint. Replaces 24 per-platform leaf workflows.
# Design + rationale: docs/architecture/ci.md
#
# Shape: build once per target triple on Linux, then execute the resulting
# bundle on native runners that have no Rust toolchain at all.
#
# ## Why this file is repetitive instead of one build matrix
#
# `needs:` on a matrix job is all-or-nothing in GitHub Actions: a single
# `test` matrix depending on a single `build` matrix would make the Linux
# tests -- ready first -- wait for the slowest cross-build in the set. GitHub
# offers no per-leg dependency edge, so each triple gets its own build/test
# job pair and its own `needs:`. The Linux lane reports red/green ~15 minutes
# before the slowest lane finishes.
#
# The triple -> {build host, cross strategy, exec runner} mapping is still
# owned by ci/ci_matrix.py; tests/test_ci_matrix.py asserts this file has not
# drifted from it.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  # The main merge queue (#2048): a group runs the routine lanes a main push
  # runs (#2125).
  merge_group:
  # Nightly native run on main (#1849): routine CI is Linux-only, so a
  # Windows/macOS regression could otherwise sit on main until an unrelated
  # ci-full PR surfaced it. Off-peak so it does not contend with ci-full PRs
  # for macOS runners. `nightly-report` below turns a red run into an issue.
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact reachable commit SHA to validate
        required: true
        type: string
  # The release (auto-release.yml) runs this whole workflow on the tagged SHA
  # in its own run. A release recomputes everything: from a tag push the
  # attestation and reuse steps below never fire (they key on pull_request or
  # a main push), and a non-empty candidate_sha resolves the full tier exactly
  # as a manual dispatch does. Nothing earlier is consulted (#2202).
  workflow_call:
    inputs:
      candidate_sha:
        description: Exact commit SHA to validate
        required: true
        type: string

# Deliberately NO `profile` input anywhere in this file. Release builds are
# reachable only from auto-release.yml; _build-target.yml enforces that.

# A main push keeps one active run and only the newest pending one (#2048,
# as obs-rust/obs-studio's push build): the merge queue already tested each
# merged tree, so a burst of merges must not stack parallel main runs. The
# nightly and SHA-pinned dispatch runs on main stay independent (run_id), and
# every other ref cancels its superseded run. A candidate run (manual
# dispatch or the release's call) is always independent and never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.candidate_sha && format('candidate-{0}', github.run_id) || github.ref == 'refs/heads/main' && (github.event_name == 'push' && 'main-push' || github.run_id) || github.ref }}
  cancel-in-progress: ${{ !inputs.candidate_sha && github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  # setup-soldr's yank audit deletes only the exact poisoned cache keys it
  # restored; without this permission it must fail closed.
  actions: write

jobs:
  # A queue ref carries the base commit (gh-readonly-queue/main/pr-<N>-<sha>),
  # so the concurrency group above never pairs a PR's rebuilt queue run with
  # the one main's movement replaced; this cancels the older one (#2048).
  cancel-superseded:
    name: Cancel superseded queue runs
    if: ${{ !cancelled() && github.event_name == 'merge_group' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ci
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cancel
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m ci.cancel_superseded

  # ---------------------------------------------------------------- static --
  # The mode job every other job needs. It installs nothing beyond the
  # runner's cached Python (zackees/ci.yml GEN-018): it pins the source SHA,
  # resolves the CI mode and verified main-push reuse, in about 10 s. The lint
  # itself is `static-checks` below, which runs beside the builds instead of
  # ahead of them. PRs run the hosted checks without a local Bosn prerequisite.
  static:
    name: CI mode
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      mode: ${{ steps.mode.outputs.tier }}
      source_ref: ${{ steps.source.outputs.ref }}
      reuse: ${{ steps.reuse.outputs.reuse }}
      reuse_evidence: ${{ steps.reuse.outputs.evidence_json }}
      would_reuse: ${{ steps.reuse.outputs.would_reuse }}
      reuse_reason: ${{ steps.reuse.outputs.reason }}
      reuse_pr: ${{ steps.reuse.outputs.pr }}
      reuse_run_url: ${{ steps.reuse.outputs.run_url }}
      reuse_tree: ${{ steps.reuse.outputs.tree }}
      # Only a verified byte-identical main push may reuse validation.
      # PRs and merge groups execute every selected hosted check.
      skip_lint-linux-x64: ${{ steps.reuse_skip.outputs.skip_lint-linux-x64 }}
      skip_test-linux-x64-unit: ${{ steps.reuse_skip.outputs.skip_test-linux-x64-unit }}
      skip_static-checks: ${{ steps.reuse_skip.outputs.skip_static-checks }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}
          fetch-depth: 0
      - name: Verify source and workflow provenance
        id: source
        shell: bash
        env:
          SOURCE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}
          EVENT_SHA: ${{ github.sha }}
          # A release call arrives as the caller's tag push; a candidate SHA
          # makes it a dispatch for provenance and mode resolution.
          EVENT_NAME: ${{ inputs.candidate_sha && 'workflow_dispatch' || github.event_name }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::invalid source SHA'; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$SOURCE_REF" ]] || { echo '::error::checkout SHA mismatch'; exit 1; }
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            git merge-base --is-ancestor "$SOURCE_REF" "$EVENT_SHA" || { echo '::error::candidate is not on selected branch'; exit 1; }
            git diff --quiet "$SOURCE_REF" "$EVENT_SHA" -- .github/workflows .github/actions ci || { echo '::error::workflow or CI helpers changed since candidate SHA'; exit 1; }
            echo 'PROVENANCE_VERIFIED=true' >> "$GITHUB_ENV"
          fi
          echo "ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve CI mode and candidate SHA
        id: mode
        env:
          EVENT_NAME: ${{ inputs.candidate_sha && 'workflow_dispatch' || github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          DISPATCH_TIER: full
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PROVENANCE_VERIFIED: ${{ env.PROVENANCE_VERIFIED }}
        run: python -m ci.ci_matrix
      # Pinned shared verifier for default-branch reuse. No local receipt is
      # required or accepted to skip a pull-request job.
      - name: Checkout ci-lint
        uses: actions/checkout@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          repository: zackees/ci.yml
          ref: 839c8f6b03c08a94977d57eb339740407424a434
          path: .ci-lint
          persist-credentials: false
          sparse-checkout: ci_lint
      # zackees/ci.yml#157 (GEN-021): byte-identical merged-tree reuse.
      # zackees/ci.yml#310 + owner directive 2026-10-04: promote immediately.
      # The shadow quota (100 decisive runs, 30 for low-volume) bought
      # confidence in the tool rather than soundness in the decision, and
      # by the rule of three 100 clean runs only bounds the false-reuse
      # rate at ~3%. `reuse-report` on this workflow since 2026-09-30:
      # 40 decisive runs, 17 safe skips (42.5%), 0 false-reuse candidates.
      # --queue-evidence (#2048): a queue merge of a PR that was behind main
      # leaves the pushed tree != the PR head's; the green merge_group run on
      # the pushed commit itself then proves it instead.
      - name: Default-branch reuse (enforce)
        id: reuse
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          PYTHONPATH=.ci-lint python -m ci_lint reuse-check
          --workflow ci.yml --mode enforce --queue-evidence --github-output --out reuse-check.json
          --max-age-hours 12
          --required-job 'Static checks'
          --required-job 'Dylint / Dylint (host)'
          --required-job 'Dylint / Dylint (x86_64-pc-windows-msvc)'
          --required-job 'Dylint / Dylint (aarch64-apple-darwin)'
          --required-job 'Clippy linux-x64 / x86_64-unknown-linux-gnu'
          --required-job 'Build linux-x64 / x86_64-unknown-linux-gnu'
          --required-job 'Test linux-x64 (unit) (rust) / x86_64-unknown-linux-gnu unit'
          --required-job 'Test linux-x64 (unit) (py1of3) / x86_64-unknown-linux-gnu unit'
          --required-job 'Test linux-x64 (unit) (py2of3) / x86_64-unknown-linux-gnu unit'
          --required-job 'Test linux-x64 (unit) (py3of3) / x86_64-unknown-linux-gnu unit'
      # GEN-021 strategy (i) from docs/designs/default-branch-verified-reuse.md
      # section 8: on a reused push, skip the VALIDATION jobs and keep the
      # CACHE WRITERS. Dylint and Build linux-x64 still run, so every main
      # push keeps refreshing the caches PRs restore from; only the work a
      # green PR already proved is skipped.
      #
      # The reuse drift window is bounded by --max-age-hours 12 above (a
      # proving run older than 12h forces a full run) plus the live
      # re-verification reuse-check performs on every job it skips. The
      # nightly `schedule` run (#1849) is a native-coverage backstop, not a
      # reuse one: it never skips or reuses anything (guard below).
      #
      # Fail-closed by construction: this step emits nothing unless the
      # decision above set reuse=true, which reuse-check only does after one
      # merged PR, an identical tree, and a green per-job proving run.
      - name: Select jobs to skip on a verified reuse
        id: reuse_skip
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REUSE: ${{ steps.reuse.outputs.reuse }}
        run: |
          set -euo pipefail
          if [ "$REUSE" != "true" ]; then
            echo "reuse is '$REUSE' -- no job is skipped"
            exit 0
          fi
          # Validation only. dylint and build-linux-x64 are deliberately
          # absent: they are the default-branch cache writers.
          for job in static-checks lint-linux-x64 test-linux-x64-unit; do
            echo "skip_$job=true" >> "$GITHUB_OUTPUT"
          done
          echo "skipping validation jobs on a verified byte-identical merge"
      # The nightly run exists to execute every lane. The steps above only
      # compute skips on main pushes, so nothing is set here today;
      # this makes a future change that waives a lane on schedule fail loudly
      # instead of quietly turning the backstop into a no-op (#1849).
      - name: Nightly runs skip nothing
        if: github.event_name == 'schedule'
        env:
          SKIPS: ${{ steps.reuse_skip.outputs.skip_lint-linux-x64 }}${{ steps.reuse_skip.outputs.skip_test-linux-x64-unit }}${{ steps.reuse_skip.outputs.skip_static-checks }}${{ steps.reuse.outputs.reuse }}
          MODE: ${{ steps.mode.outputs.tier }}
        run: |
          set -euo pipefail
          [ "$MODE" = full ] || { echo "::error::nightly run resolved mode '$MODE', not full"; exit 1; }
          [ -z "$SKIPS" ] || { echo "::error::nightly run must not skip or reuse a job (got '$SKIPS')"; exit 1; }

  # Everything platform-independent, once, on the cheapest runner. Previously
  # ruff + cargo fmt + banned_imports each ran six times. Ordered cheapest-first
  # inside ci/lint.py so a ruff error reds out in well under a minute.
  static-checks:
    name: Static checks
    needs: static
    if: needs.static.outputs.skip_static-checks != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ needs.static.outputs.source_ref }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.19"
          # Local-runner signal (ACT=true; act2 keeps RUNNER_ENVIRONMENT
          # github-hosted, so caching itself needs no override). setup-uv
          # prunes wheels before saving, cheap on GitHub's network but it
          # empties a local cache, and it has no runner-aware knob: exception
          # zackees/ci.yml#226. Separate key so the hosted entry stays pruned.
          prune-cache: ${{ !env.ACT }}
          cache-suffix: ${{ env.ACT && 'act-unpruned' || '' }}
      - name: Sync
        run: uv sync --frozen --group dev --no-install-project --python 3.11
      - name: Setup soldr
        uses: forge-ci/setup-soldr@v0
        env:
          SOLDR_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Remote S3 build cache credentials; absent secrets disable it.
          SOLDR_S3_CACHE_ACCESS_KEY: ${{ secrets.SOLDR_S3_CACHE_ACCESS_KEY }}
          SOLDR_S3_CACHE_SECRET_KEY: ${{ secrets.SOLDR_S3_CACHE_SECRET_KEY }}
        with:
          # Remote S3 build cache: bucket forge-ci-cache in DigitalOcean Spaces sfo3.
          # The 50G high watermark is enforced only on the merge-queue
          # (merge_group) singleton; unset bucket/creds disables it entirely.
          s3-bucket: forge-ci-cache
          s3-endpoint: sfo3.digitaloceanspaces.com
          s3-region: sfo3
          s3-cache-limit: 50G
          cache: true
          # setup-soldr#559: a failed or cancelled job saves no build outputs
          # (its store may be partial; an exact-hit key is never re-saved).
          job-status: ${{ job.status }}
          build-cache-mode: thin
          shims: true
          preserve-source-mtimes: true
          # #2342 / #2316: the shared solo-toolchain cache entry is poisoned
          # (key says rustc1.95.0, archive ships 1.98.0-nightly) and setup-soldr
          # cannot repair it without actions: write. Off until #2316 re-enables it.
          solo-toolchain-cache: false
          cache-key-suffix: static
          prebuild-deps: none
      # `.venv/bin/python`, not `uv run`: pyproject sets build-backend = "soldr",
      # so `uv run` would sync the project and kick off a full PEP 517 maturin
      # build of the Rust binary. See lint:8-24 for the same workaround.
      - name: Static checks
        run: .venv/bin/python -m ci.lint --static-only

  # ------------------------------------------------------------ cache-maint --
  # zackees/ci.yml CACHE-004 / rule CACHE-034: `[flow.main]` declares
  # `pre-prune = true`, and that declaration is what waives the lockfile-change
  # peak from CACHE-004's worst-case arithmetic. The waiver is only honest if
  # something actually pre-prunes. Until this job existed, nothing did, so the
  # waiver was free: ci.toml was modelled at its 9.0 GiB steady state while a
  # lockfile change would really have peaked near 17.6 GiB against a 10 GB cap.
  #
  # Writer flows only, and specifically the default branch: ci.toml's
  # `[cache].write-on = ["main"]` and `[flow.main].cache = "write"` mean a PR
  # or a tag run must never delete anything. Gated on the event rather than on
  # the plan's `cache_save` output because this repository's `static` job
  # predates that output and exposes no plan-driven cache key of its own.
  #
  # `actions: write` is required and is granted per job (ci.toml
  # [allow].permissions."actions: write" = ["cache-maint"]). It is deliberately
  # NOT on the `static` job: a job-level grant there would arm `actions: write`
  # for every pull_request run of a job that checks out the PR head.
  cache-maint:
    name: cache-maint
    needs: static
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      # A missing push base in this shallow checkout triggers conservative pruning.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.static.outputs.source_ref }}
          fetch-depth: 2
      # ci.toml's `linter` pin, the same ci_lint tree the `static` job intends
      # to check out (CT-004).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: zackees/ci.yml
          ref: 839c8f6b03c08a94977d57eb339740407424a434
          path: .ci-lint
          persist-credentials: false
          sparse-checkout: ci_lint
      - name: Set up maintenance runtime
        uses: ./.github/actions/setup-exec
        with:
          native-window-runtime: false
      # Pre-pruning spends live deletes, so it must only happen on a push that
      # actually changed a lockfile.
      - name: Detect a lockfile change
        id: lockfile
        run: '"$VENV_PY" -m ci.cache_lockfile_changed'
      - name: Pre-prune superseded lockfile-keyed cache entries
        if: steps.lockfile.outputs.changed == 'true'
        env:
          PYTHONPATH: .ci-lint
          GITHUB_TOKEN: ${{ github.token }}
        run: '"$VENV_PY" -m ci_lint cache preprune --repo . --lockfile-changed --max-deletes 50'
      # The superseded/off-branch/LRU sweep moved to `queue-cache-janitor`,
      # the run's final job (GEN-022), so it runs after every cache writer.

  # ---------------------------------------------------------------- dylint --
  # Dylint is required in every mode. The reusable workflow runs the custom
  # lint on each supported host's selected Rust source.
  #
  # Both default-branch cache writers wait for pre-pruning. PRs skip that
  # dependency, so always() permits their normal validation. A failed prune
  # prevents new cache writes and makes the required validation gate fail.
  dylint:
    name: Dylint
    needs: [static, cache-maint]
    if: >-
      ${{ always() && !cancelled()
          && needs.static.result == 'success'
          && (needs.cache-maint.result == 'success' || needs.cache-maint.result == 'skipped') }}
    uses: ./.github/workflows/_dylint.yml
    with:
      source_ref: ${{ needs.static.outputs.source_ref }}
    # Reusable workflows get no secrets by default; the remote S3 build cache
    # in _dylint.yml needs SOLDR_S3_CACHE_ACCESS_KEY / _SECRET_KEY.
    secrets: inherit

  # ----------------------------------------------------------------- core ---
  # Minimal runs Linux x64 unit tests. The Linux integration suite alone cost
  # 6.87 runner-minutes in the measured minimal run (#35845956093), taking it
  # above the 12.5% routine/full budget; ci-test and full retain that suite.
  # ci-test also adds Windows x64; ci-full and SHA-pinned dispatches add the
  # other architectures.

  # Clippy used to run inside build-linux-x64, serially ahead of the compile,
  # so every PR waited ~41 s on it between Static and the unit suite even
  # though the unit lane consumes none of its output. It now runs beside the
  # build. It shares the build job's zccache namespace (cache-key-suffix
  # build-<triple>) read-only: two writers to one immutable key race, and the
  # build job's outputs are the ones the next run needs.
  lint-linux-x64:
    name: Clippy linux-x64
    needs: static
    # windows mode keeps these routine lanes too (#1652): without a merge
    # queue, CI OK green must imply Linux passed on the same head SHA.
    if: needs.static.outputs.mode != '' && needs.static.outputs.skip_lint-linux-x64 != 'true'
    uses: ./.github/workflows/_build-target.yml
    # Reusable workflows get no secrets by default; setup-soldr's remote S3
    # build cache needs SOLDR_S3_CACHE_ACCESS_KEY / _SECRET_KEY.
    secrets: inherit
    with:
      source_ref: ${{ needs.static.outputs.source_ref }}
      target: x86_64-unknown-linux-gnu
      runs-on: ubuntu-24.04
      strategy: soldr
      clippy: true
      compile: false
      bundle: false
      # Doc-tests ride here, beside the build rather than ahead of the unit
      # lanes (_build-target.yml's Doc tests step).
      doctest: true
      save-cache: "false"

  build-linux-x64:
    name: Build linux-x64
    # The second of the two default-branch cache writers; `cache-maint` must
    # precede it for the same reason it precedes `dylint` (see above).
    needs: [static, cache-maint]
    # windows mode keeps these routine lanes too (#1652): without a merge
    # queue, CI OK green must imply Linux passed on the same head SHA.
    # `always() && !cancelled()` for the same reason as `dylint` above: a
    # skipped cache-maint (every non-push run) must not skip this writer.
    if: >-
      ${{ always() && !cancelled()
          && needs.static.result == 'success'
          && (needs.cache-maint.result == 'success' || needs.cache-maint.result == 'skipped')
          && needs.static.outputs.mode != '' }}
    uses: ./.github/workflows/_build-target.yml
    secrets: inherit
    with:
      source_ref: ${{ needs.static.outputs.source_ref }}
      target: x86_64-unknown-linux-gnu
      runs-on: ubuntu-24.04
      strategy: soldr
      # Linux x64 clippy runs in lint-linux-x64, off this job's critical path.
      clippy: false

  # The unit suite is CPU-bound and a hosted runner is two physical cores, so
  # in-process parallelism (pytest-xdist) measured slower, not faster. It runs
  # as independent jobs instead: the Rust harnesses, and each half of the
  # pytest suite (ci/pytest_shard.py). LINUX_X64_UNIT_SHARDS in ci/ci_matrix.py
  # owns the names.
  test-linux-x64-unit:
    name: Test linux-x64 (unit)
    needs: [static, build-linux-x64]
    # `always() && !cancelled()` for the same reason as dylint/build-linux-x64:
    # build-linux-x64 is SKIPPED whenever its own inputs are unmet, and a
    # skipped `needs:` cascades -- a bare `if:` here left the minimal lane with
    # nothing green for `CI OK` to aggregate.
    if: >-
      ${{ always() && !cancelled()
          && needs.static.outputs.skip_test-linux-x64-unit != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [rust, py1of3, py2of3, py3of3]
    uses: ./.github/workflows/_run-tests.yml
    with:
      source_ref: ${{ needs.static.outputs.source_ref }}
      target: x86_64-unknown-linux-gnu
      runs-on: ubuntu-24.04
      suite: unit
      shard: ${{ matrix.shard }}

  test-linux-x64-integration:
    name: Test linux-x64 (integration)
    needs: [static, build-linux-x64]
    # Survive cache-maint's intentional PR skip, as the unit suite does.
    if: >-
      ${{ always() && !cancelled()
          && needs.static.result == 'success'
          && needs.build-linux-x64.result == 'success'
          && (needs.static.outputs.mode == 'extended' || needs.static.outputs.mode == 'full') }}
    uses: ./.github/workflows/_run-tests.yml
    with:
      source_ref: ${{ needs.static.outputs.source_ref }}
      target: x86_64-unknown-linux-gnu
      runs-on: ubuntu-24.04
      suite: integration

  # #1323: real Claude Code on the scripted mock agent backend. Full mode
  # only (ci-full): it installs Claude Code from npm.
  # Linux-only, like integration: ci-test runs it, so validating a harness
  # change never needs ci-full's macOS and Windows targets (#2149).
  test-linux-x64-harness:
    name: Test linux-x64 (harness)
    needs: [static, build-linux-x64]
    if: >-
      ${{ always() && !cancelled()
          && needs.static.result == 'success'
          && needs.build-linux-x64.result == 'success'
          && (needs.static.outputs.mode == 'extended' || needs.static.outputs.mode == 'full') }}
    uses: ./.github/workflows/_run-tests.yml
    with:
      source_ref: ${{ needs.static.outputs.source_ref }}
      target: x86_64-unknown-linux-gnu
      runs-on: ubuntu-24.04
      suite: harness

  build-windows-x64:
    name: Build windows-x64
    needs: static
    # `windows` is the ci-windows iteration mode (#1310).
    if: needs.static.outputs.mode == 'extended' || needs.static.outputs.mode == 'full' || needs.static.outputs.mode == 'windows'
    uses: ./.github/workflows/_build-target.yml
    secrets: inherit
    with:
      source_ref: ${{ needs.static.outputs.source_ref }}
      target: x86_64-pc-windows-msvc
      runs-on: ubuntu-24.04
      strategy: soldr
      # The Windows x64 cfg surface.
      clippy: true

  test-windows-x64:
    name: Test windows-x64
    needs: [static, build-windows-x64]
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration]
    uses: ./.github/workflows/_run-tests.yml
    with:
      source_ref: ${{ needs.static.outputs.source_ref }}
      target: x86_64-pc-windows-msvc
      runs-on: windows-2025
      suite: ${{ matrix.suite }}

  # macOS ARM is core because it cross-compiles on Linux like every other
  # triple. `soldr prepare --target aarch64-apple-darwin` provisions the
  # target-shaped Apple SDK, which is what supplies the `-framework Accelerate`
  # that vendor/whisper-rs-sys/build.rs:27-28 emits unconditionally for apple
  # targets. Before that, darwin needed either a hand-fetched SDK behind a
  # MACOS_SDK_URL repo variable or a cold C++ build on a native macOS runner --
  # the scarcest runner class, and a ~20 minute tax on every PR push.
  build-macos-arm:
    name: Build macos-arm
    needs: static
    # `macos` is the ci-macos iteration mode: both Darwin lanes, nothing else native.
    if: needs.static.outputs.mode == 'full' || needs.static.outputs.mode == 'macos'
    uses: ./.github/workflows/_build-target.yml
    secrets: inherit
    with:
      source_ref: ${{ needs.static.outputs.source_ref }}
      target: aarch64-apple-darwin
      runs-on: ubuntu-24.04
      strategy: soldr
      # macOS-only modules are not covered by Linux's cfg(unix).
      clippy: true

  test-macos-arm:
    name: Test macos-arm
    needs: [static, build-macos-arm]
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration]
    uses: ./.github/workflows/_run-tests.yml
    with:
      source_ref: ${{ needs.static.outputs.source_ref }}
      target: aarch64-apple-darwin
      runs-on: macos-15
      suite: ${{ matrix.suite }}

  # ----------------------------------------------------------------- full ---
  # Second architecture of each OS. Runs only in full mode; release attempts
  # must request a SHA-pinned full run before publication.

  build-linux-arm:
    name: Build linux-arm
    needs: static
    if: needs.static.outputs.mode == 'full'
    uses: ./.github/workflows/_build-target.yml
    secrets: inherit
    with:
      source_ref: ${{ needs.static.outputs.source_ref }}
      target: aarch64-unknown-linux-gnu
      runs-on: ubuntu-24.04
      strategy: soldr
      clippy: false

  test-linux-arm:
    name: Test linux-arm
    needs: [static, build-linux-arm]
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration]
    uses: ./.github/workflows/_run-tests.yml
    with:
      source_ref: ${{ needs.static.outputs.source_ref }}
      target: aarch64-unknown-linux-gnu
      runs-on: ubuntu-24.04-arm
      suite: ${{ matrix.suite }}

  build-windows-arm:
    name: Build windows-arm
    needs: static
    if: needs.static.outputs.mode == 'full'
    uses: ./.github/workflows/_build-target.yml
    secrets: inherit
    with:
      source_ref: ${{ needs.static.outputs.source_ref }}
      target: aarch64-pc-windows-msvc
      runs-on: ubuntu-24.04
      # The cheapest cross in the set: whisper-rs is cfg-excluded on this
      # triple (crates/clud-bin/Cargo.toml:149), so there is no C++ or CMake
      # at all -- only ring/blake3 need the MSVC CRT that `soldr prepare`
      # provisions.
      strategy: soldr
      # Windows ARM has target-specific voice worker code.
      clippy: true

  test-windows-arm:
    name: Test windows-arm
    needs: [static, build-windows-arm]
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration]
    uses: ./.github/workflows/_run-tests.yml
    with:
      source_ref: ${{ needs.static.outputs.source_ref }}
      target: aarch64-pc-windows-msvc
      runs-on: windows-11-arm
      suite: ${{ matrix.suite }}

  build-macos-x64:
    name: Build macos-x64
    needs: static
    # `macos` is the ci-macos iteration mode: both Darwin lanes, nothing else native.
    if: needs.static.outputs.mode == 'full' || needs.static.outputs.mode == 'macos'
    uses: ./.github/workflows/_build-target.yml
    secrets: inherit
    with:
      source_ref: ${{ needs.static.outputs.source_ref }}
      target: x86_64-apple-darwin
      runs-on: ubuntu-24.04
      strategy: soldr
      clippy: false

  test-macos-x64:
    name: Test macos-x64
    needs: [static, build-macos-x64]
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration]
    uses: ./.github/workflows/_run-tests.yml
    with:
      source_ref: ${{ needs.static.outputs.source_ref }}
      target: x86_64-apple-darwin
      runs-on: macos-15-intel
      suite: ${{ matrix.suite }}

  # ---------------------------------------------------------------- gate ----
  # Single required status check. Branch protection points here, so adding or
  # removing a triple never requires touching branch-protection settings.
  # `always()` stays (#2273): a skipped required check counts as success, so
  # a hand-cancelled run must still publish a failing CI OK. Only a run that a
  # newer run of this workflow on the same head SHA superseded passes without
  # verification; the newer run's CI OK, posted later, is the verdict.
  ci-ok:
    name: CI OK
    if: always()
    needs:
      - static
      - static-checks
      - dylint
      - lint-linux-x64
      - build-linux-x64
      - test-linux-x64-unit
      - test-linux-x64-integration
      - test-linux-x64-harness
      - build-windows-x64
      - test-windows-x64
      - build-macos-arm
      - test-macos-arm
      - build-linux-arm
      - test-linux-arm
      - build-windows-arm
      - test-windows-arm
      - build-macos-x64
      - test-macos-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      # cache-maint is NOT listed in this job's `needs:`. It is not a gate: it
      # runs only on a default-branch push, and its own step is skipped unless
      # a lockfile changed. Listing it would put a `skipped` result into the
      # `RESULTS` blob the Check results step inspects, which is exactly the
      # malformed-condition class the explicit lists below exist to prevent.
      # #2273: a run that concurrency cancelled because a newer run of this
      # workflow started on the same head SHA is superseded; it passes so its
      # stale failure cannot block the replacement's verdict. Any other
      # cancelled need (a hand-cancelled run) still fails the verifier.
      - name: Detect superseded run
        id: superseded
        if: contains(toJSON(needs.*.result), 'cancelled')
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          workflow_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id)
          newer=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/runs?head_sha=$HEAD_SHA&per_page=100" \
            --jq "[.workflow_runs[] | select(.id > $GITHUB_RUN_ID)] | length")
          if [ "$newer" -gt 0 ]; then
            echo "Superseded by $newer newer run(s) on $HEAD_SHA; their CI OK is the verdict." >>"$GITHUB_STEP_SUMMARY"
            echo "superseded=true" >>"$GITHUB_OUTPUT"
          fi
      - name: Checkout verified source
        if: steps.superseded.outputs.superseded != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ needs.static.outputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up uv
        if: steps.superseded.outputs.superseded != 'true'
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: false
      - name: Default-branch reuse evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          WOULD_REUSE: ${{ needs.static.outputs.would_reuse }}
          REASON: ${{ needs.static.outputs.reuse_reason }}
          PR: ${{ needs.static.outputs.reuse_pr }}
          RUN_URL: ${{ needs.static.outputs.reuse_run_url }}
          TREE: ${{ needs.static.outputs.reuse_tree }}
          REUSE: ${{ needs.static.outputs.reuse }}
        run: |
          {
            echo '### Default-branch verified reuse'
            printf '\nReuse: %s\n\nWould reuse: %s\n\nReason: %s\n\nPR: %s\n\nProving run: %s\n\nTree: %s\n' "$REUSE" "$WOULD_REUSE" "$REASON" "$PR" "$RUN_URL" "$TREE"
            if [ "$REUSE" = "true" ]; then
              echo 'Validation jobs were skipped; Dylint and Build linux-x64 still ran as cache writers.'
            else
              echo 'No job was skipped; every selected job ran in full.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      # The shared verifier derives required jobs from this workflow and
      # independently verifies hosted results and default-branch reuse.
      - name: Check results
        if: steps.superseded.outputs.superseded != 'true'
        env:
          RESULTS: ${{ toJSON(needs) }}
          REUSE_EVIDENCE: ${{ needs.static.outputs.reuse_evidence }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RESULTS" >needs.json
          printf '%s\n' "${REUSE_EVIDENCE:-null}" >reuse-check.json
          uvx --from git+https://github.com/zackees/ci.yml@839c8f6b03c08a94977d57eb339740407424a434 ci-lint gate --repo . --workflow-plan ci.yml --needs needs.json --default-branch-reuse reuse-check.json --event "$GITHUB_EVENT_PATH"

  # ---------------------------------------------------------- nightly-report --
  # Turns the nightly run's verdict into one tracking issue (#1849): opened
  # (or commented on) when CI OK is anything but success -- cancelled and
  # skipped count as red -- and closed by the next green night. Never runs
  # on PRs or pushes, and is the only job holding issues: write.
  nightly-report:
    name: Nightly report
    if: always() && github.event_name == 'schedule'
    needs: [static, ci-ok]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Open, update or close the nightly-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.ci-ok.result }}
          SHA: ${{ needs.static.outputs.source_ref || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          label=ci-nightly-failure
          existing=$(gh issue list --label "$label" --state open --json number --jq '.[0].number // empty')
          if [ "$RESULT" = success ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" --comment "Nightly full CI is green again on \`$SHA\`: $RUN_URL"
            fi
            exit 0
          fi
          failed=$(gh run view "$RUN_ID" --json jobs --jq '[.jobs[] | select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != null and .name != "Nightly report") | "- \(.name): \(.conclusion)"] | join("\n")')
          body=$(printf 'Nightly full CI on `main` ended `%s` at `%s`.\n\nRun: %s\n\nJobs not green:\n%s\n' "$RESULT" "$SHA" "$RUN_URL" "${failed:-"(none reported; see the run)"}")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh label create "$label" --color B60205 --description "Nightly full CI on main failed" 2>/dev/null || true
            gh issue create --title "Nightly full CI failed on main" --label "$label" --body "$body"
          fi

  # GEN-022 (forge-ci/ci.yml#405): every merge-queue run and main push ends
  # with the ci-lint cache janitor. It needs every other job and runs on
  # always(), so it sweeps after every cache writer, even when a job failed:
  # superseded generations (soldr or config hash changes), entries saved on
  # other refs, retired families, then LRU down to [cache].budget. Without the
  # sweep the repo sat at 10.5 GB and GitHub's own LRU evicted main's live
  # build cache, so PRs restored a day-old fallback at a 67% hit rate (#2037).
  # The non-cancelling `cache-janitor` group keeps one sweep at a time.
  queue-cache-janitor:
    name: End-of-queue cache janitor
    needs: [cancel-superseded, static, static-checks, cache-maint, dylint, lint-linux-x64, build-linux-x64, test-linux-x64-unit, test-linux-x64-integration, test-linux-x64-harness, build-windows-x64, test-windows-x64, build-macos-arm, test-macos-arm, build-linux-arm, test-linux-arm, build-windows-arm, test-windows-arm, build-macos-x64, test-macos-x64, ci-ok, nightly-report]
    if: always() && (github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: cache-janitor
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    steps:
      # The janitor reads only ci.toml from this repository.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: ci.toml
          sparse-checkout-cone-mode: false
      # ci.toml's `linter` pin (CT-004).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: zackees/ci.yml
          ref: 839c8f6b03c08a94977d57eb339740407424a434
          path: .ci-lint
          persist-credentials: false
          sparse-checkout: ci_lint
      - name: Sweep superseded and off-branch cache entries
        env:
          PYTHONPATH: .ci-lint
          GITHUB_TOKEN: ${{ github.token }}
        run: python -P -m ci_lint cache janitor --repo . --default-branch main --max-deletes 50
