[workspace]
resolver = "2"
members = [
    "crates/clud-bin",
    "crates/tap",
    "testbins/daemon-stub",
    "testbins/mock-agent",
    "testbins/probe-dll",
    "testbins/probe-target",
]
exclude = [
    "dylints/ban_dirs_home_dir",
    "dylints/ban_manual_slash_normalize",
    "dylints/enforce_platform_boundary",
    # Phase-1 web-terminal fidelity spike (zackees/clud#929). Kept out of the
    # workspace so its Tauri/wry tree + portable-pty spawning don't perturb the
    # shipped build, CI matrix, or `bash lint`.
    "clud-webterm",
]

# Function-complexity ratchet (zackees/ci.yml#229, RUST-018): every function
# stays under clippy's default ceilings (cognitive complexity 25, 100 lines).
# clippy runs with `-D warnings`, so `warn` is a hard gate. The functions
# already over a ceiling carry `#[expect(clippy::..., reason = "...")]`, never
# `allow`: an expectation that stops firing is itself a warning, so a
# refactored function's suppression is deleted in the same change.
[workspace.lints.clippy]
cognitive_complexity = "warn"
too_many_lines = "warn"

[workspace.metadata.soldr]
# Cross targets `soldr lint` and `bash lint` clippy on top of the host, so
# cfg(windows) / cfg(target_os = "macos") code fails at lint, not in a native
# lane (RUST-033, #2370). Keep in step with the remote build lanes. Dylint stays
# host-only locally until forge-ci/soldr#4016 (MSVC env under the Dylint nightly).
targets = ["x86_64-pc-windows-msvc", "aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-gnu"]

[workspace.metadata.soldr.lint]
# Dylint runs in `bash lint` with the pinned nightly (dylints/*/rust-toolchain);
# a `soldr lint` Dylint step would run without that pin and fail.
steps = ["fmt", "clippy"]

[workspace.metadata.dylint]
libraries = [{ path = "dylints/*" }]

[workspace.package]
version = "2.8.50"
edition = "2021"
rust-version = "1.95"
license-file = "LICENSE"
repository = "https://github.com/zackees/clud"
homepage = "https://github.com/zackees/clud"

# `debug = "line-tables-only"` keeps file:line in panic stack traces (so
# `bash test` failures resolve to source) without paying the full-DWARF
# compile-time + wheel-size tax. Applied to dev AND release so a panic
# in a production wheel still shows where it crashed.
[profile.dev]
debug = "line-tables-only"

# Optimize third-party crates at opt-level=1 in dev. Our own crates stay
# at the cargo-default opt-level=0 for fast incremental rebuilds; deps
# (regex / running-process / tokio) are paid for once on cold compile and
# then cached, so the per-iteration cost is negligible while runtime
# performance in dev tests is meaningfully better.
[profile.dev.package."*"]
opt-level = 1

[profile.release]
debug = "line-tables-only"
# Cargo performs this after it has produced the packed `.dwp` sidecar.  Unlike
# `strip = "symbols"`, this retains the normal symbol table used by runtime
# diagnostics while ensuring a wheel cannot accidentally retain `.debug_*`.
strip = "debuginfo"
# Move the bulk of the DWARF into a sidecar instead of the shipped binary.
# On ELF that debug info is embedded, which is why the manylinux wheel was
# ~7x the Windows/macOS ones (those always wrote a `.pdb` / `.dSYM` sidecar)
# and why 2.7.2/2.7.3/2.7.4 all died on PyPI's 100 MB project limit.
# Only Linux actually changes. `packed` is already MSVC's default, and on
# Apple it selects the `.dSYM` bundle -- but `soldr prepare` exports
# `-Csplit-debuginfo=off` for Apple triples whenever dsymutil is unavailable,
# which outranks this profile key, so the Apple cross lanes cannot break on it.
# On ELF it emits a `.dwp` and moves `.debug_info` / `.debug_str` (and,
# depending on DWARF version, `.debug_ranges`) out of the binary -- 72-91 MB of
# the 2.7.4 `clud`'s 137 MB, projecting the wheel from 105 MB to ~40-44 MB.
# `.debug_line` stays embedded, so a panic in a production wheel still
# resolves file:line without fetching anything, and function names still come
# from `.symtab`. What moves to the sidecar is the inlined-subroutine DIEs:
# without the `.dwp` a backtrace gives one file:line per *physical* frame
# instead of the expanded inline caller chain, so the sidecar is not optional
# for full-fidelity traces. It is attached to the GitHub release
# (ci/xbuild.py::collect_debuginfo) for the fetch path tracked by #1016.
# [profile.dev] deliberately keeps everything embedded: a developer's crash
# must symbolicate with no sidecar at all.
split-debuginfo = "packed"
