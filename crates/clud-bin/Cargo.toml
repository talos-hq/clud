[package]
name = "clud"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Fast CLI for running Claude Code and Codex in YOLO mode"

[dependencies]
arboard = "3"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
# #1708: masked native credential window; no persistence or browser surface.
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "clipboard", "wayland", "x11"] }
# Native crash handler for SIGSEGV / SIGBUS / SIGILL / SIGFPE / SIGABRT
# on Unix and structured exceptions on Windows. By default it does NOT
# attach a SIGINT / CTRL_C_EVENT handler, so the existing `ctrlc`-based
# Ctrl-C path (#372 / `ctrl_c_track`) remains the authoritative handler
# for Ctrl-C / Ctrl-Break.
crash-handler = "0.7"
ctrlc = "3"
# Issue #13: voice-mode stack. Linux capture shells out to `arecord` on
# F3 press so libasound is loaded only by that on-demand helper process,
# not by every `clud --help` / `clud --version` startup. Windows and macOS
# keep the in-process cpal/rodio path below. Transcription itself is
# stubbed out on every platform (whisper-rs removed; see voice/worker.rs).
# Issue #13: model auto-downloader needs a per-OS cache dir resolver,
# a small blocking HTTP client, and a hash verifier. `ureq` is sync and
# avoids dragging in a tokio runtime just to fetch one file.
dirs = "5"
# Issue #626: per-launch bearer tokens for the authenticated loopback bridge.
# `fill` delegates to the operating system CSPRNG and avoids a general-purpose
# RNG dependency for one 256-bit secret.
getrandom = "0.4"
# Issue #132: gitignore-aware repo walk for the startup large-file guard.
# Matches the major version ripgrep / fd use; no feature flags needed.
ignore = "0.4"
# File identity (including NTFS hardlinks), rather than matching size/mtime.
same-file = "1"
# Issue #556: in-process git-index parse for the large-file guard's fast
# (tracked-files + cached sizes) pass. Pinned exactly; license MIT OR
# Apache-2.0 (gitoxide family). Only the index reader is pulled in — no ODB,
# no network, no hashing on the scan path.
gix-index = "=0.54.0"
# gix-index pulls in gix-hash but leaves the hash-backend feature to the
# top-level crate; without one, gix-hash fails to compile ("set the sha1 or
# sha256 feature"). We only enable the SHA-1 backend (the index parse itself
# runs with skip_hash). Transitive dep, pinned to match; MIT OR Apache-2.0.
gix-hash = { version = "=0.26.0", features = ["sha1"] }
# Issue #545: daemon-owned, non-recursive filesystem discovery.  The
# reconciliation fallback in `daemon::watch_service` bounds missed Windows
# notifications / watcher failure, so `notify` is never the sole source of
# truth.
notify = "7"
sha2 = "0.10"
hmac = "0.12.1"
ureq = { version = "2", default-features = false, features = ["tls"] }
webpki-roots = "0.26.11"
url = "2"
# Issue #73 / #110: embedded KV store for the session and tracked-entry
# registries. `redb` is pure Rust (no bundled C toolchain), single-writer
# at the file level, and ships its own file locking — replaces the
# previous `rusqlite` (bundled SQLite) dependency to cut cold-build time
# and drop the C-toolchain pressure on CI.
redb = "2"
thiserror = "2"
strum = { version = "0.27.2", features = ["derive"] }
# Issue #138: cross-platform advisory file lock used to serialize concurrent
# redb opens of the session registry, and to serialize gc-daemon bringup.
# redb itself takes an exclusive per-process file lock — two `clud`
# processes that open the registry at the same time would otherwise race
# and one would fail with `DatabaseAlreadyOpen`. The lockfile narrows
# the redb-open window to a few milliseconds at startup/shutdown so
# concurrent launches serialize cleanly.
fs4 = "0.13"
running-process = { version = "4.10.19", default-features = false, features = ["telemetry", "client", "originator-scan", "pty"] }
# running-process consumer adoption (upstream #385): the daemon's broker
# v1 frame lane binds a local-socket endpoint (named pipe on Windows,
# unix socket elsewhere) alongside the legacy TCP listener. Pinned to
# the same major as running-process's own `interprocess` dep so stream
# types are identical across the API boundary.
interprocess = "2"
icy_sixel = "0.5"
# #1189: rasterizes toast text into the kitty-graphics toast image. Pure Rust,
# no system font library, so manylinux wheels stay self-contained; the font
# itself is bundled from assets/fonts/.
fontdue = { version = "0.9", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
zeroize = "1"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sysinfo = "0.37"
terminal_size = "0.4"
# Plain serde-friendly TOML deserializer. Used by the shell::git_bash_resolver
# manifest reader (issue #447); the existing toml_edit dep keeps round-trip
# editing of settings.toml, but a one-shot `toml::from_str` is the cleanest
# fit for an embedded vendor manifest.
toml = "0.8"
toml_edit = "0.25.11"
# Issue #447: pure-Rust zip extraction for the vendored Git Bash bundle.
# `deflate` is the only compression method present in git-bash-bin.zip;
# disabling default features avoids pulling bzip2/zstd C deps.
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
vt100 = "0.16"
vte = "0.15"
wasmi = "0.40.0"
# Embedded QuickJS engine for `clud workflow` scripts (Anthropic workflow
# format: export const meta + agent/parallel/pipeline/phase), #2471.
rquickjs = { version = "0.14", features = ["futures", "macro", "loader"] }
walkdir = "2"
which = "7"
# Issue #183: in-process HTTP listener for the `clud ui` dashboard.
# `tiny_http` is pure Rust, synchronous, and slots into the daemon's
# existing `std::thread` model without introducing tokio. The daemon
# binds a second loopback port alongside the JSON IPC listener and
# serves a tiny embedded SPA + `/state.json` from it.
tiny_http = "0.12"
# Issue #183: cross-platform browser launch for `clud ui`. Tiny crate
# (~50 LOC of platform glue: macOS `open`, Linux `xdg-open`, Windows
# `cmd /c start`). One dep beats triplicate hand-rolled code.
open = "5"
# Issue #457: split EDITOR/VISUAL-style commands such as `code --wait`
# without sending config paths through an ad hoc shell string.
shell-words = "1.1"
# zackees/clud#519: generic `bad_commands` rule matching in the
# block-bad-cmd hook — glob patterns compile to an anchored regex, and
# `match_mode: "regex"` rules use this directly.
regex = "1"
# #1962: real shell grammars for the PreToolUse command scanner, replacing a
# hand-written tokenizer. MIT; the grammars compile one C file each through
# `cc` (no C++). Pinned exactly so a grammar update is a reviewed change:
# node kinds are matched by name in `shell_ast`.
tree-sitter = "=0.26.13"
tree-sitter-bash = "=0.25.1"
tree-sitter-powershell = "=0.26.4"
tempfile = "3"
os_pipe = "1.2.3"

[dev-dependencies]
serde_yaml = "0.9"
# #1148: the nested-sweep tests need a *mixed-age* tree — a stale session
# directory beneath a fresh parent — which is the exact shape the bug lives
# in. The existing idiom in `gc::session_tmp` shifts the test's notion of
# "now" into the future, which ages every entry uniformly and so cannot
# express that shape. Setting mtimes directly can; `std::fs::File` cannot
# open a directory on Windows, so this does it portably. Already in the
# lockfile via `notify`/`gix-index`, so it is not new to the build.
filetime = "0.2"
# #436: the `RUNNING_PROCESS_FAKE_BACKEND` seam that
# `fake_backend_seam_overrides_cached_endpoint` exercises lives behind
# running-process's off-by-default `test-seams` feature (upstream #433 R4).
# Enabling it here compiles the seam into the `cargo test` build only —
# Cargo unifies this dev-dep feature into the test harness but NOT into
# `cargo build --bin clud`, so the production binary stays seam-free per
# the upstream rule ("never compiled into production consumers").
running-process = { version = "4.10.19", default-features = false, features = ["telemetry", "client", "originator-scan", "pty", "test-seams"] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
# #468: ignored Win32 feasibility probe for user-land process/file
# observation. Kept test-only so no production dependency graph changes.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[build-dependencies]
prost-build = "0.14"
protox = "0.9"

[lib]
name = "clud"
path = "src/lib.rs"

[target.'cfg(not(target_os = "linux"))'.dependencies]
cpal = "0.16"
rodio = { version = "0.21", default-features = false, features = ["playback"] }

[target.'cfg(unix)'.dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["glow"] }
libc = "0.2"
signal-hook = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
# Issue #877: Keychain-backed DeepSeek API-key storage.
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# Issue #877: Secret Service-backed storage; deliberately excludes kernel keyutils.
# async-secret-service (not sync-secret-service) so the backend is zbus, a pure-Rust
# D-Bus client -- sync-secret-service pulls in dbus-secret-service -> libdbus-sys,
# which needs the system libdbus C library and its headers at build time. async-io
# gives zbus a runtime without pulling in all of tokio.
keyring = { version = "=3.6.3", default-features = false, features = ["async-secret-service", "async-io", "crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["wgpu"] }
# #933: materialize the standard machine + user login environment from the
# registry rather than preserving the shell that happened to start the daemon.
winreg = "0.10"
# Issue #79 (Part A) — Windows IDropTarget COM registration on the console
# window so dragged files reach `clud` even when conhost would refuse the
# drop. Pinned to the same major as transitively present in the lockfile
# (windows-0.61.3) to avoid introducing a second copy of the crate graph.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    # #673 Phase 1a: OS-authoritative daemon-sparing signals for the
    # foreground job reaper — listening-endpoint ownership
    # (GetExtendedTcpTable) and services-session membership
    # (ProcessIdToSessionId).
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_RemoteDesktop",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# Required so the `windows_core::Result` / `windows_core::Ref` types
# referenced in our `IDropTarget_Impl` signatures (and the
# `#[implement]` proc-macro re-exported as `windows::core::implement`)
# resolve through a stable path. The umbrella `windows` crate also
# re-exports them as `windows::core::*` but having the direct dep is
# the documented pattern for `#[implement]` users.
windows-core = "0.61"
# #1351: `console_input` runs its own `ReadConsoleInputW` loop (to pair UTF-16
# surrogates) and hands each KEY_EVENT_RECORD to running-process's translator,
# whose signature takes winapi's type. running-process already depends on
# winapi 0.3 with every feature listed here, so this adds nothing to the build.
# The #575 consumer regression test also builds these records.
winapi = { version = "0.3", features = [
    "consoleapi",
    "handleapi",
    "minwindef",
    "processenv",
    "synchapi",
    "winbase",
    "wincon",
    "winerror",
    "winnt",
    "winuser",
] }

[[bin]]
name = "clud"
path = "src/main.rs"
# No tests: skip the empty harness (#1714, ci/banned_empty_harnesses.py).
test = false

[[bin]]
name = "clud-kittyterm-paste"
path = "src/bin/clud_kittyterm_paste.rs"
# Its logic and tests live in `clud::paste_image` (#1726): a bin harness
# links the whole workspace for three tests.
test = false

# Issue #464: opt-in process-sampler microbench. Behind a feature so it is
# not compiled by `cargo clippy --all-targets`, which `bash lint` runs on all
# six CI platforms -- a measurement harness should not tax every lint lane.
[features]
bench = []
# Only candidate CI builds may read a local release transport fixture.
installer-ci-fixture = []

[[bin]]
name = "clud-bench-proc-sampler"
path = "src/bin/clud_bench_proc_sampler.rs"
# No tests: skip the empty harness (#1714, ci/banned_empty_harnesses.py).
test = false
required-features = ["bench"]

# Issue #1067 step 2: replay recorded agent Bash commands through the command
# gate and report what it would cost. Opt-in for the same reason as above.
[[bin]]
name = "clud-bench-gate-replay"
path = "src/bin/clud_bench_gate_replay.rs"
# No tests: skip the empty harness (#1714, ci/banned_empty_harnesses.py).
test = false
required-features = ["bench"]

# #1551: `clud` is the only executable clud ships. `clud-cmd-scan`,
# `clud-block-bad-cmd`, `clud-shim` and every shim alias (`python`, `rm`,
# `gh`, ...) are argv[0] names of that one binary; see `src/multicall.rs`.
# Do not add a `[[bin]]` for a new helper: give it a dispatch name instead.
# `tests/test_build_wheel.py` fails if a second shipped script appears.

# Issue #517: test-only probe binary. Installs the real production
# `startup::install_ctrl_c_flag` handler and reports which
# `CtrlEventKind` fired, so `tests/integration/signals/ctrlc_signal_kinds.rs` and
# `tests/integration/signals/ctrlc_windows_events.rs` can drive it with real OS signals /
# console-control events instead of re-implementing the handler.
[[bin]]
name = "clud-ctrlc-probe"
path = "src/bin/clud_ctrlc_probe.rs"
# No tests: skip the empty harness (#1714, ci/banned_empty_harnesses.py).
test = false

[lints]
workspace = true
