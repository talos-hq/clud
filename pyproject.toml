[build-system]
# Rolling latest, deliberately: no version is pinned. The CI `setup-soldr`
# steps and `./install` also float to latest, so no path fossilizes on an
# old soldr protocol (#1026). `tests/test_packaging_metadata.py` rejects a
# numeric pin here. See DD-120 (supersedes the exact-pin DD-020).
requires = ["soldr"]
build-backend = "soldr"

[project]
name = "clud"
version = "2.8.48"
description = "Fast Rust CLI for running Claude Code and Codex in YOLO mode"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Clud Proprietary License" }
license-files = ["LICENSE"]
authors = [{ name = "Zach Vorhies" }]
keywords = ["claude", "codex", "cli", "ai", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]
# The MCP bridge (`python -m clud.mcp_server`) ships ready to run: Hermes
# Agent launches it from a plain `uv tool install clud`, and an opt-in extra
# was silently dropped by any reinstall or self-upgrade that omitted it,
# leaving `import clud.mcp_server` failing on `No module named 'anyio'`.
# Same Windows arm64 exclusion as the test group below: `mcp` needs
# `pyjwt[crypto]` -> `cryptography`, which has no win_arm64 wheel and cannot
# build from sdist there without OpenSSL.
dependencies = [
    "mcp>=2.1; sys_platform != 'win32' or platform_machine != 'ARM64'",
]

[project.optional-dependencies]
# Kept as an empty alias so existing `clud[mcp]` installs and docs still
# resolve; the SDK is now a base dependency.
mcp = []

[project.urls]
Homepage = "https://github.com/zackees/clud"
Repository = "https://github.com/zackees/clud"
Issues = "https://github.com/zackees/clud/issues"

[dependency-groups]
# Everything needed to RUN the test suites and nothing needed to BUILD.
# CI exec jobs (.github/actions/setup-exec) sync only this group: they have no
# Rust toolchain by construction, so cmake and maturin are dead weight there —
# ~150 MB of wheels downloaded onto the scarcest runners in the pool.
# The WASM CLI test uses its deterministic checked-in fixture, so the test
# environment needs no external C/C++ compiler.
test = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pytest-timeout>=2.3.0",
    # The Windows installer selector test runs in a real ConPTY; it must not
    # silently lose that coverage in the unit lane.
    "pywinpty>=3.0.5; sys_platform == 'win32'",
    "psutil>=5.9",
    "running-process==4.10.1",
    # `tests/test_outline_tool.py` parses fixtures with the same grammars the
    # bundled `code/outline.py` script pins.
    "tree-sitter==0.26.0",
    "tree-sitter-rust==0.24.2",
    "tree-sitter-python==0.25.0",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-typescript==0.23.2",
    "tree-sitter-c==0.24.2",
    "tree-sitter-cpp==0.23.4",
    # `tests/test_mcp_server.py` imports the bridge module directly, and
    # skips itself when the SDK is absent. CI exec jobs sync only this group
    # (no project dependencies), so the SDK is listed here as well as in
    # `[project] dependencies`.
    #
    # Not on Windows arm64. `mcp` requires `pyjwt[crypto]`, whose `crypto`
    # extra pulls `cryptography`, and upstream stopped publishing `win_arm64`
    # wheels after 46.0.3 -- the current 50.0.1 ships `win_amd64` only. uv
    # therefore builds it from sdist there, which needs an OpenSSL
    # installation the runner does not have:
    #
    #     Building cryptography==50.0.1
    #     x Failed to build `cryptography==50.0.1`
    #     warning: openssl-sys@0.9.117: Could not find directory of OpenSSL
    #     installation, and this `-sys` crate cannot proceed
    #
    # That failed both windows-arm lanes on every `main` run. The bridge is
    # platform-independent Python covered on the five other lanes, so the
    # coverage lost here is the packaging of a dependency, not the code.
    "mcp>=2.1; sys_platform != 'win32' or platform_machine != 'ARM64'",
]
dev = [
    { include-group = "test" },
    "cmake>=3.26",
    # No [zig] extra: zig is retired from every lane (#859/#863) — the extra
    # only pulled ~50 MB of ziglang into each dev venv for a flag nothing
    # passes anymore.
    "maturin>=1.7,<2",
    "ruff>=0.8.0",
]
# soldr is intentionally NOT a Python dev dep — install it via ./install
# (or `./install --global`) which fetches the binary from
# https://github.com/zackees/soldr/releases. CI uses forge-ci/setup-soldr@v0.

[tool.maturin]
manifest-path = "crates/clud-bin/Cargo.toml"
bindings = "bin"
python-source = "src"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.py" },
    { file = "crates/**/*.rs" },
    { file = "crates/**/*.toml" },
    { file = "crates/clud-bin/assets/codex-models.json" },
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-markers"]
testpaths = ["tests"]
# `tests/` is a package (`tests/__init__.py`), so pytest's prepend import mode
# inserts the repo root — not `tests/` — onto sys.path. That breaks the
# top-level `import _subprocess_helpers` in tests/integration/conftest.py, which
# aborts collection of BOTH the unit and integration lanes on every platform.
# Put `tests/` on sys.path explicitly so the bare helper imports resolve.
pythonpath = ["tests"]
# Any single test that runs longer than this is considered hung; pytest-timeout
# will interrupt it and dump a stack trace pointing at the exact line. Without
# this, a stuck subprocess call (e.g. stderr.readline() on Windows when the
# child never writes) causes GHA to cancel the whole workflow at 45 minutes
# with no actionable log. The thread method works on Windows where SIGALRM
# isn't available.
timeout = 90
timeout_method = "thread"
# Complements `timeout` rather than duplicating it, and exists to answer the
# question #994 could not: when the Windows integration lane exits 1 with no
# FAILED line and no pytest summary, did it hang or did it die?
#
# `timeout_method = "thread"` cannot interrupt every hang — a thread blocked in
# a C-level call keeps blocking, and pytest then produces nothing. faulthandler
# arms a C-level timer instead, so it dumps every thread's stack even from
# inside such a call. Set below `timeout` so the stacks land *before* the
# interrupt attempt.
#
# The two outcomes are now distinguishable: thread stacks in the log mean it
# hung, and where; silence still means the process was killed or crashed
# outright, which is itself the answer.
faulthandler_timeout = 80
# #1686: harness tests build a repo, a bare origin and a Claude config under
# tmp_path; pytest keeps the last 3 runs' base temps by default (GBs under
# ~/.clud/tmp in a clud session). Drop a passing test's dir at once and a
# passing run's base temp at the end; ci/pytest_tmp_retention.py removes the
# read-only trees pytest's own rmtree leaves and prints a failed run's path.
tmp_path_retention_policy = "failed"
markers = [
    "integration: end-to-end tests with mock agents; skipped unless CLUD_INTEGRATION_TESTS=1",
    "real_claude: opt-in secret-free protocol fixtures using an installed Claude Code binary",
    "daemon: Tier 1 (#2356): runs a built clud/mock-agent binary or a daemon; excluded from `bash test --host`",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "PT", "RUF", "C901"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["N802", "N803", "N806", "PT009", "PT027"]
