# prooft attestation policy (forge-ci/prooft 0.2.0, GATE-010 format). See
# docs/architecture/ci.md#attested-clippy-and-dylint-prooft-dd-225 and DD-225.
#
# `python -m ci.attest` runs each lane locally on a clean, committed HEAD
# and, when the lane passes, amends the commit message with one
# `Ci-Attestation:` trailer per gate (never a tracked file). The trailer is
# bound to the commit's tree and parents: a changed byte, a rebase or a new
# merge of main invalidates it. It is an honesty contract, not a signature.
#
# Hosted CI reads THIS FILE FROM THE PR BASE (a PR cannot loosen it) through
# the hash-pinned prooft release in ci.yml's `CI mode` job. Only same-repo
# `pull_request` runs consult it. A PR that edits this file, .github/,
# ci.toml or local-gate.toml, a fork, or a `[ci-full]`/`[no-attest]` title
# tag runs everything. A gate without a valid, fresh (24 h) trailer runs
# hosted. Merge groups, main pushes, nightlies and releases never consult it.
#
# A job entry reduces that job (or Dylint leg) in place: it still starts and
# reports success, but skips its setup and checks. Dylint legs are the
# `matrix.pass` entries of `_dylint.yml:dylint`, one entry per leg, so a
# host that cannot run one cross pass still earns the others. The hosted-only
# `crates` leg formats and tests all dylints/* libraries; no trailer can reduce
# it. Dylint gates prove workspace linting and library loading, not unit/UI tests.
version: 1
mode: shadow
gates:
  rust/x86_64-unknown-linux-gnu/clippy: {lane: clippy}    # xbuild clippy (workspace, all targets)
  rust/x86_64-unknown-linux-gnu/doctest: {lane: clippy}   # xbuild doctest, same job
  rust/x86_64-unknown-linux-gnu/dylint: {lane: dylint}    # host leg: guarded workspace pass only
  rust/x86_64-pc-windows-msvc/dylint: {lane: dylint-x86_64-pc-windows-msvc}
  rust/aarch64-apple-darwin/dylint: {lane: dylint-aarch64-apple-darwin}
jobs:
  ci.yml:lint-linux-x64:
    - rust/x86_64-unknown-linux-gnu/clippy
    - rust/x86_64-unknown-linux-gnu/doctest
  _dylint.yml:dylint-host: [rust/x86_64-unknown-linux-gnu/dylint]
  _dylint.yml:dylint-x86_64-pc-windows-msvc: [rust/x86_64-pc-windows-msvc/dylint]
  _dylint.yml:dylint-aarch64-apple-darwin: [rust/aarch64-apple-darwin/dylint]
