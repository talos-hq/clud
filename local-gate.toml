# clud's local gate (zackees/ci.yml GATE-001..010). See
# docs/architecture/ci.md#attested-skip-gate-008010.
#
# Optional local diagnostic run, from a clean, committed tree:
#
#   uvx --from git+https://github.com/zackees/ci.yml@442537be9afba8cdfe7270b83a5493e9910aa522 ci-lint local-gate run
#
# runs the PR plan once under bosn ci -> act2 and, on success, amends
# HEAD's message with a tree-bound
# `Local-Gate:` trailer plus one `Ci-Attestation:` per gate in
# ci-attestations.yml. Hosted CI does not consume these local receipts.
[gate]
run = ["bosn", "ci", "run", "--workspace", ".", "--trigger", "pr", "--wait", "--json"]
verify = "ci.yml:static"
# Local execution is optional. Every selected hosted PR job must run.
mode = "shadow"
# cancel-superseded (GEN-022, ci.yml#409) runs only on merge_group, first,
# with no `needs:`; only the end-of-queue cache janitor depends on it.
verify-exempt = ["cancel-superseded"]

# Bosn's full run keeps its parallel schedule when three or more lanes miss.
# The shared ci-lint verifier derives checks from these workflows and
# validates the terminal Bosn report before seeding lane passes.
[gate.full-run]
receipt = "lane-passes-v1"
min-misses = 3

[gate.lanes.static]
run = ["bosn", "ci", "run", "--workspace", ".", "--trigger", "pr", "--wait", "--json", "--job", "static-checks"]
tools = ["bosn", "docker", "uv", "python"]

[gate.lanes.dylint]
run = ["bosn", "ci", "run", "--workspace", ".", "--trigger", "pr", "--wait", "--json", "--job", "dylint"]
# Rust lanes read nothing in root tests/, docs/, bench/ or root *.md except
# the fixture `openrouter_catalog.rs` embeds (#2040).
exclude = ["tests/**", "docs/**", "bench/**", "*.md"]
keep = ["tests/fixtures/**"]
tools = ["bosn", "docker", "uv", "python"]

[gate.lanes.clippy]
run = ["bosn", "ci", "run", "--workspace", ".", "--trigger", "pr", "--wait", "--json", "--job", "lint-linux-x64"]
# Rust lanes read nothing in root tests/, docs/, bench/ or root *.md except
# the fixture `openrouter_catalog.rs` embeds (#2040).
exclude = ["tests/**", "docs/**", "bench/**", "*.md"]
keep = ["tests/fixtures/**"]
tools = ["bosn", "docker", "uv", "python"]

[gate.lanes.build]
run = ["bosn", "ci", "run", "--workspace", ".", "--trigger", "pr", "--wait", "--json", "--job", "build-linux-x64"]
# Rust lanes read nothing in root tests/, docs/, bench/ or root *.md except
# the fixture `openrouter_catalog.rs` embeds (#2040).
exclude = ["tests/**", "docs/**", "bench/**", "*.md"]
keep = ["tests/fixtures/**"]
tools = ["bosn", "docker", "uv", "python"]

[gate.lanes.unit]
run = ["bosn", "ci", "run", "--workspace", ".", "--trigger", "pr", "--wait", "--json", "--job", "test-linux-x64-unit"]
tools = ["bosn", "docker", "uv", "python"]


# Shared execution proof; clud declares mappings, never parses runner receipts.
# Requires the qualified act2 capability release and corresponding Bosn pins.
[gate.replay]
repository = "talos-hq/clud"
workflow = "ci.yml"
mode = "minimal"
report-source = "stdout"
qualified = true
provider-query = ["bosn", "ci", "runners", "list", "--json"]

[[gate.replay.selections]]
lane = "static"
job = "static-checks"
event = "pull_request"

[[gate.replay.selections]]
lane = "dylint"
job = "dylint"
event = "pull_request"

[[gate.replay.selections]]
lane = "clippy"
job = "lint-linux-x64"
event = "pull_request"

[[gate.replay.selections]]
lane = "build"
job = "build-linux-x64"
event = "pull_request"

[[gate.replay.selections]]
lane = "unit"
job = "test-linux-x64-unit"
event = "pull_request"

[[gate.replay.jobs]]
source-job = "ci.yml:static"
lanes = ["static", "dylint", "clippy", "build", "unit"]

[[gate.replay.jobs]]
source-job = "ci.yml:cache-maint"
lanes = ["dylint", "build", "unit"]

[[gate.replay.jobs]]
source-job = "ci.yml:static-checks"
lanes = ["static"]

[[gate.replay.jobs]]
source-job = "_dylint.yml:dylint"
lanes = ["dylint"]

[[gate.replay.jobs]]
source-job = "_build-target.yml:build"
lanes = ["clippy", "build", "unit"]

[[gate.replay.jobs]]
source-job = "_run-tests.yml:test"
lanes = ["unit"]

# The former GATE-008 skip mapping remains for optional local tooling, in shadow
# mode. Hosted CI does not invoke the local verifier or consume its skip
# outputs. Main pushes retain separate verified PR-tree reuse; cache writers
# still run. PRs and release dispatches execute their selected hosted jobs.
[gate.trust]
mode = "shadow"
skip = [
  "ci.yml:static-checks",
  "ci.yml:dylint",
  "ci.yml:lint-linux-x64",
  "ci.yml:build-linux-x64",
  "ci.yml:test-linux-x64-unit",
]
covered-by = { "ci.yml:static-checks" = ["static"], "ci.yml:dylint" = ["dylint"], "ci.yml:lint-linux-x64" = ["clippy"], "ci.yml:build-linux-x64" = ["build"], "ci.yml:test-linux-x64-unit" = ["unit"] }
# Labels that select lanes the local plan does not run.
full-labels = ["ci-test", "ci-windows", "ci-macos", "ci-full", "ci:full"]
# The CI helpers only the skipped jobs run.
surfaces = ["ci/**"]
