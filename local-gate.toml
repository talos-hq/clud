# clud's retired Bosn local gate (zackees/ci.yml GATE-001..010, DD-190).
# Its receipts grant nothing. Hosted credit for Clippy and Dylint comes only
# from prooft trailers (ci-attestations.yml, `python -m ci.attest`); see
# docs/architecture/ci.md#attested-clippy-and-dylint-prooft-dd-225.
#
# Optional local diagnostic run, from a clean, committed tree:
#
#   uvx --from git+https://github.com/zackees/ci.yml@442537be9afba8cdfe7270b83a5493e9910aa522 ci-lint local-gate run
#
# runs each lane below (lint lanes on the host through soldr, the rest as
# single-job bosn ci -> act2 replays) and, on success, amends HEAD's message
# with a tree-bound
# `Local-Gate:` trailer plus one `Ci-Attestation:` per gate in
# ci-attestations.yml. Hosted CI does not consume these local receipts.
# Lint never runs under Bosn. The gate's only Bosn replay is the Linux unit
# job, which bosn runs with its `needs:` closure (CI mode, cache-maint, the
# Linux x64 build), none of which lints. `bosn ci run` takes one `--job`, and
# the bare PR plan would replay the Static checks, Dylint and Clippy jobs, so
# `run` names that one job. Every lint job runs on the host through
# `soldr lint` (the lanes below). There is deliberately no [gate.full-run].
[gate]
run = ["bosn", "ci", "run", "--workspace", ".", "--trigger", "pr", "--wait", "--json", "--job", "test-linux-x64-unit"]
verify = "ci.yml:static"
# Local execution is optional. Every selected hosted PR job must run.
mode = "shadow"
# cancel-superseded (GEN-022, ci.yml#409) runs only on merge_group, first,
# with no `needs:`; only the end-of-queue cache janitor depends on it.
verify-exempt = ["cancel-superseded"]

# Lint never runs under Bosn; `soldr lint` on the host only. Each pass checks
# formatting, runs Clippy and runs every `[workspace.metadata.dylint]` library
# (Cargo.toml's `[workspace.metadata.soldr.lint] steps`), then the repo extra
# `bash lint --static-only` (ruff, repo guards: the Static checks job). The
# lane names match ci-attestations.yml's prooft lanes. They read the whole
# tree (no `exclude`), since the static checks cover tests/, docs/ and *.md.
#
# `dylint`: Clippy on the host and every `[workspace.metadata.soldr].targets`
# triple, and `--cross-dylint` repeats Dylint per declared cross target, which
# covers the remote `dylint` job's host, Windows and macOS legs.
[gate.lanes.dylint]
run = ["soldr", "lint", "rust", "--check", "--cross-dylint"]
tools = ["soldr", "uv"]

# `clippy`: the remote `lint-linux-x64` Clippy, on the Linux host only, plus
# the Static checks job through the extra.
[gate.lanes.clippy]
run = ["soldr", "lint", "rust", "--check", "--host-only"]
tools = ["soldr", "uv"]

# The remote `lint-linux-x64` job also runs doc-tests (ci/xbuild.py doctest);
# they are tests, not lint, and run on the host through soldr.
[gate.lanes.doctest]
run = ["soldr", "cargo", "test", "--workspace", "--doc"]
exclude = ["tests/**", "docs/**", "bench/**", "*.md"]
keep = ["tests/fixtures/**"]
tools = ["soldr"]

# The unit replay also builds Linux x64 (its `needs:`), so it covers the
# Build linux-x64 job too.
[gate.lanes.unit]
run = ["bosn", "ci", "run", "--workspace", ".", "--trigger", "pr", "--wait", "--json", "--job", "test-linux-x64-unit"]
tools = ["bosn", "docker", "uv", "python"]


# Shared execution proof; clud declares mappings, never parses runner receipts.
# Requires the qualified act2 capability release and corresponding Bosn pins.
[gate.replay]
repository = "talos-hq/clud"
workflow = "ci.yml"
mode = "minimal"
report-source = "stdout"
qualified = true
provider-query = ["bosn", "ci", "runners", "list", "--json"]

[[gate.replay.selections]]
lane = "unit"
job = "test-linux-x64-unit"
event = "pull_request"

[[gate.replay.jobs]]
source-job = "ci.yml:static"
lanes = ["unit"]

[[gate.replay.jobs]]
source-job = "ci.yml:cache-maint"
lanes = ["unit"]

[[gate.replay.jobs]]
source-job = "_build-target.yml:build"
lanes = ["unit"]

[[gate.replay.jobs]]
source-job = "_run-tests.yml:test"
lanes = ["unit"]

# The former GATE-008 skip mapping remains for optional local tooling, in shadow
# mode. Hosted CI does not invoke the local verifier or consume its skip
# outputs. Main pushes retain separate verified PR-tree reuse; cache writers
# still run. PRs and release dispatches execute their selected hosted jobs.
[gate.trust]
mode = "shadow"
skip = [
  "ci.yml:static-checks",
  "ci.yml:dylint",
  "ci.yml:lint-linux-x64",
  "ci.yml:build-linux-x64",
  "ci.yml:test-linux-x64-unit",
]
covered-by = { "ci.yml:static-checks" = ["clippy"], "ci.yml:dylint" = ["dylint"], "ci.yml:lint-linux-x64" = ["clippy", "doctest"], "ci.yml:build-linux-x64" = ["unit"], "ci.yml:test-linux-x64-unit" = ["unit"] }
# Labels that select lanes the local plan does not run.
full-labels = ["ci-test", "ci-windows", "ci-macos", "ci-full", "ci:full"]
# The CI helpers only the skipped jobs run.
surfaces = ["ci/**"]
